<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <script>
    (function(){try{var s=JSON.parse(localStorage.getItem('skygo_session')||'null');var t=(s&&s.token)||localStorage.getItem('apex_token')||'';if(!t){location.replace('login.html?next=assets.html');}}catch(e){location.replace('login.html?next=assets.html');}})();
    </script>
    <script>
    /* عزل الحسابات: عند تبديل الحساب نمسح أي حالة محلية قديمة حتى يبدأ كل حساب من الصفر */
    (function(){try{var ss=JSON.parse(localStorage.getItem('skygo_session')||'null')||{};var tok=(ss&&ss.token)||localStorage.getItem('apex_token')||'';var owner=(((ss&&ss.email)||'')+'').toLowerCase()||tok||'';if(!owner)return;var prev=localStorage.getItem('apex_acct_owner')||'';if(prev!==owner){['skygo_futures_pos','skygo_futures_hist','skygo_futures_ord','apex_fees_collected','apex_kyc_status'].forEach(function(k){try{localStorage.removeItem(k);}catch(e){}});localStorage.setItem('apex_acct_owner',owner);}}catch(e){}})();
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
    <title>CryptoSphere Pro - محفظة الأصول</title>
    <style>
        :root {
            --bg-deep: #050814;
            --glass-bg: rgba(17, 24, 39, 0.75);
            --glass-border: rgba(255, 255, 255, 0.08);
            --neon-blue: #3b82f6;
            --neon-green: #10b981;
            --neon-red: #f43f5e;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }
        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .phone-frame {
            width: 390px;
            height: 780px;
            background: linear-gradient(145deg, #0f172a, #030712);
            border-radius: 45px;
            box-shadow: 0 0 50px rgba(59, 130, 246, 0.2);
            border: 3px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
        }
        .app-content {
            position: relative;
            z-index: 1;
            padding: 16px;
            flex-grow: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .section-title { font-size: 16px; font-weight: bold; color: #f3f4f6; }
        .glass-card { background: var(--glass-bg); backdrop-filter: blur(16px); border: 1px solid var(--glass-border); border-radius: 20px; padding: 16px; }
        .asset-row { display:flex; justify-content:space-between; align-items:center; padding:9px 0; border-bottom:1px solid rgba(255,255,255,.05); }
        .asset-row:last-child{border-bottom:0}
        .asset-left{display:flex;align-items:center;gap:9px}
        .asset-left img{width:26px;height:26px;border-radius:50%}
        .asset-sym{font-weight:800;font-size:13px}
        .asset-amt{font-weight:800;font-size:13px}
        .asset-usd{font-size:10px;color:var(--text-muted)}
        .history-list { display: flex; flex-direction: column; gap: 8px; max-height: 230px; overflow-y: auto; }
        .history-item { display: flex; justify-content: space-between; align-items: center; background: var(--glass-bg); padding: 10px 12px; border-radius: 12px; border: 1px solid var(--glass-border); font-size: 12px; }
        .empty{color:var(--text-muted);font-size:12px;text-align:center;padding:14px}
        .bottom-nav { background: rgba(11, 15, 25, 0.85); backdrop-filter: blur(20px); border-top: 1px solid var(--glass-border); display: flex; justify-content: space-around; padding: 12px 0; z-index: 10; }
        .nav-item { background: none; border: none; color: var(--text-muted); font-size: 10px; cursor: pointer; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; transition: 0.3s; }
        .nav-item.active { color: #60a5fa; text-shadow: 0 0 10px rgba(96, 165, 250, 0.6); }
        .nav-item svg { width: 20px; height: 20px; fill: currentColor; }
    </style>
</head>
<body>
    <div class="phone-frame">
        <div class="app-content">
            <div class="section-title">إدارة الأصول والمحفظة 💰</div>

            <div class="glass-card">
                <div style="font-size: 11px; color: var(--text-muted);">إجمالي الأصول المتاحة (من رصيد السيرفر)</div>
                <div style="font-size: 26px; font-weight: 800; color: #34d399; margin: 4px 0;" id="walletBalance">$0.00</div>
            </div>

            <div style="font-size: 13px; font-weight: bold; color: #cbd5e1;">أرصدتي</div>
            <div class="glass-card" id="assetsCard"><div class="empty">جارٍ التحميل...</div></div>

            <div style="font-size: 13px; font-weight: bold; color: #cbd5e1; margin-top: 4px;">سجل المعاملات</div>
            <div class="history-list" id="historyList"><div class="empty">جارٍ التحميل...</div></div>
        </div>

        <div class="bottom-nav">
            <a href="index.html" class="nav-item"><svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>الرئيسية</a>
            <a href="mining.html" class="nav-item"><svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>التعدين</a>
            <a href="trade.html" class="nav-item"><svg viewBox="0 0 24 24"><path d="M3.5 18.49l6-6.01 4 4L22 6.92l-1.41-1.41-7.09 7.97-4-4L2 16.99z"/></svg>التداول</a>
            <a href="assets.html" class="nav-item active"><svg viewBox="0 0 24 24"><path d="M21 18v1c0 1.1-.9 2-2 2H5c-1.11 0-2-.9-2-2V5c0-1.1.89-2 2-2h14c1.1 0 2 .9 2 2v1h-9c-1.11 0-2 .9-2 2v8c0 1.1.89 2 2 2h9zm-9-2h10V8H12v8zm4-2.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>الأصول</a>
            <a href="support.html" class="nav-item"><svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 9h12v2H6V9zm8 5H6v-2h8v2zm4-6H6V6h12v2z"/></svg>الدعم</a>
        </div>
    </div>

    <script>
    /* === كل شيء يُقرأ من رصيد السيرفر — لا أرصدة وهمية بـ localStorage === */
    const $=id=>document.getElementById(id);
    const SESS=(function(){try{return JSON.parse(localStorage.getItem('skygo_session')||'null')||{};}catch(e){return {};}})();
    const TOKEN=(SESS&&SESS.token)||localStorage.getItem('apex_token')||'';
    function authHeaders(){return {'Authorization':'Bearer '+TOKEN};}
    function logout(){location.replace('login.html?next=assets.html');}
    function icoUrl(b){return 'https://cdn.jsdelivr.net/gh/atomiclabs/cryptocurrency-icons@1a63530be6e374711a8554f31b17e4cb92c25fa5/128/color/'+String(b).toLowerCase()+'.png';}
    const fmt=(n,d=2)=>Number(n||0).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});

    var priceMap={}, wallet={};
    function priceOf(b){b=String(b).toUpperCase();return b==='USDT'?1:(priceMap[b+'USDT']||0);}

    function escapeHtml(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'})[c];});}

    function renderAssets(){
        var keys=Object.keys(wallet).filter(function(k){return (Number(wallet[k])||0)>0;});
        keys.sort(function(a,b){return (Number(wallet[b])*priceOf(b))-(Number(wallet[a])*priceOf(a));});
        var total=0;
        var html=keys.map(function(k){
            var amt=Number(wallet[k])||0; var usd=amt*priceOf(k); total+=usd;
            return '<div class="asset-row"><div class="asset-left"><img src="'+icoUrl(k)+'" onerror="this.style.display=\'none\'"><div><div class="asset-sym">'+escapeHtml(k)+'</div><div class="asset-usd">≈ $'+fmt(usd,2)+'</div></div></div><div class="asset-amt">'+fmt(amt,amt>=1?4:6)+'</div></div>';
        }).join('');
        $('assetsCard').innerHTML = keys.length ? html : '<div class="empty">لا توجد أصول بعد</div>';
        $('walletBalance').innerText = '$'+fmt(total,2);
    }

    async function loadWallet(){
        if(!TOKEN){logout();return;}
        try{
            var r=await fetch('/api/wallet/me',{headers:authHeaders()});
            if(r.status===401||r.status===403){logout();return;}
            if(!r.ok)return;
            var d=await r.json();
            wallet={};var b=d.balances||{};for(var k in b){wallet[String(k).toUpperCase()]=Number(b[k])||0;}
            renderAssets();
        }catch(e){}
    }

    const TXLBL={admin_credit:'شحن من الإدارة',deposit:'إيداع',withdraw:'سحب',transfer_in:'تحويل وارد',transfer_out:'تحويل صادر',convert:'تحويل عملة',trade:'صفقة تداول'};
    async function loadHistory(){
        if(!TOKEN){logout();return;}
        try{
            var r=await fetch('/api/wallet/transactions',{headers:authHeaders()});
            if(r.status===401||r.status===403){logout();return;}
            if(!r.ok)return;
            var d=await r.json();
            var rows=(d.transactions||[]);
            var listEl=$('historyList');
            if(!rows.length){listEl.innerHTML='<div class="empty">لا توجد معاملات بعد</div>';return;}
            listEl.innerHTML=rows.map(function(tx){
                var amt=Number(tx.amount)||0;
                var pos=amt>=0;
                var sign=pos?'+':'-';
                var color=pos?'#34d399':'#f43f5e';
                var label=TXLBL[tx.type]||escapeHtml(tx.type||'معاملة');
                var cur=escapeHtml(tx.currency||'USDT');
                var date=new Date(tx.at||Date.now()).toLocaleString('en-GB',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
                var note=tx.note?('<div style="font-size:10px;color:var(--text-muted)">'+escapeHtml(tx.note)+'</div>'):'';
                return '<div class="history-item"><div><div style="font-weight:bold;">'+label+'</div><div style="font-size:10px;color:var(--text-muted);">'+date+'</div>'+note+'</div><div style="font-weight:bold;color:'+color+';">'+sign+fmt(Math.abs(amt),Math.abs(amt)>=1?2:6)+' '+cur+'</div></div>';
            }).join('');
        }catch(e){}
    }

    async function loadPrices(){
        try{
            var r=await fetch('/api/markets',{headers:{'Accept':'application/json'}});
            if(!r.ok)return;
            var arr=await r.json();
            if(Array.isArray(arr)){arr.forEach(function(d){if(d&&d.symbol){priceMap[d.symbol]=parseFloat(d.lastPrice!=null?d.lastPrice:d.price);}});}
            renderAssets();
        }catch(e){}
    }

    loadPrices(); loadWallet(); loadHistory();
    setInterval(loadWallet,8000); setInterval(loadHistory,12000); setInterval(loadPrices,10000);
    </script>
</body>
</html>
