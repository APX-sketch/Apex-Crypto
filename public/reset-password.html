<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>إعادة تعيين كلمة المرور — Apex</title>
<style>
:root{--bg:#0b0e11;--panel:#141920;--panel2:#1c232c;--border:#252d38;--txt:#eef2f6;--muted:#8a94a3;--gold1:#f8d979;--gold2:#e0a615;--green:#0ecb81;--red:#f6465d}
*{box-sizing:border-box}
body{margin:0;font-family:'Segoe UI',Tahoma,system-ui,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.wrap{width:100%;max-width:420px}
.logo{text-align:center;margin-bottom:22px}
.logo b{font-size:30px;font-weight:900;background:linear-gradient(135deg,var(--gold1),var(--gold2));-webkit-background-clip:text;background-clip:text;color:transparent}
.logo span{display:block;color:var(--muted);font-size:12px;margin-top:4px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:24px}
h1{font-size:20px;margin:0 0 4px}
.sub{color:var(--muted);font-size:13px;margin-bottom:18px;line-height:1.7}
.steps{display:flex;gap:8px;margin-bottom:18px}
.steps div{flex:1;height:5px;border-radius:4px;background:var(--panel2)}
.steps div.on{background:linear-gradient(135deg,var(--gold1),var(--gold2))}
.fld{margin-bottom:14px}
.fld label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:700}
.fld input{width:100%;padding:12px 14px;border-radius:12px;background:var(--panel2);border:1px solid var(--border);color:var(--txt);font-family:inherit;font-size:14px;outline:none}
.fld input:focus{border-color:var(--gold2)}
.code-in{text-align:center;letter-spacing:10px;font-size:22px;font-weight:800;direction:ltr}
.btn{width:100%;padding:13px;border:0;border-radius:12px;font-family:inherit;font-weight:800;font-size:15px;cursor:pointer;background:linear-gradient(135deg,var(--gold1),var(--gold2));color:#231a02;margin-top:6px}
.btn:disabled{opacity:.6;cursor:default}
.btn.ghost{background:transparent;border:1px solid var(--border);color:var(--txt)}
.alt{text-align:center;margin-top:16px;font-size:13px;color:var(--muted)}
.alt a{color:var(--gold2);font-weight:700;text-decoration:none;cursor:pointer}
.msg{padding:11px 14px;border-radius:10px;font-size:13px;margin-bottom:14px;display:none}
.msg.err{display:block;background:rgba(246,70,93,.12);color:#ff8a97;border:1px solid rgba(246,70,93,.3)}
.msg.warn{display:block;background:rgba(224,166,21,.12);color:var(--gold1);border:1px solid rgba(224,166,21,.3)}
.msg.ok{display:block;background:rgba(14,203,129,.12);color:#5be0a8;border:1px solid rgba(14,203,129,.3)}
.phase{display:none}
.phase.on{display:block}
.hint{font-size:12px;color:var(--muted);margin-top:8px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo"><b>Apex</b><span>استعادة الحساب</span></div>
  <div class="card">
    <div class="steps"><div id="st1" class="on"></div><div id="st2"></div><div id="st3"></div></div>
    <div class="msg" id="msg"></div>

    <!-- الخطوة 1: البريد -->
    <div class="phase on" id="p1">
      <h1>نسيت كلمة المرور؟</h1>
      <div class="sub">أدخل بريدك الإلكتروني وسنرسل لك رمز تحقق لإعادة تعيين كلمة المرور.</div>
      <div class="fld"><label>البريد الإلكتروني</label><input id="email" type="email" autocomplete="email" placeholder="name@email.com" dir="ltr" style="text-align:right"></div>
      <button class="btn" id="btn1" onclick="sendCode()">إرسال الرمز</button>
    </div>

    <!-- الخطوة 2: الرمز -->
    <div class="phase" id="p2">
      <h1>تحقق من البريد</h1>
      <div class="sub">أدخل الرمز المكوّن من 6 أرقام الذي وصل إلى <b id="emShow"></b>.</div>
      <div class="fld"><label>رمز التحقق</label><input id="code" class="code-in" inputmode="numeric" maxlength="6" placeholder="000000"></div>
      <button class="btn" id="btn2" onclick="goPass()">التالي</button>
      <div class="hint"><a class="alt" style="margin:0"><span onclick="resendCode()" style="color:var(--gold2);font-weight:700;cursor:pointer" id="resend">إعادة إرسال الرمز</span></a></div>
    </div>

    <!-- الخطوة 3: كلمة المرور -->
    <div class="phase" id="p3">
      <h1>كلمة مرور جديدة</h1>
      <div class="sub">اختر كلمة مرور جديدة (6 أحرف على الأقل).</div>
      <div class="fld"><label>كلمة المرور الجديدة</label><input id="np1" type="password" autocomplete="new-password" placeholder="••••••••"></div>
      <div class="fld"><label>تأكيد كلمة المرور</label><input id="np2" type="password" autocomplete="new-password" placeholder="••••••••"></div>
      <button class="btn" id="btn3" onclick="doReset()">حفظ كلمة المرور</button>
    </div>

    <div class="alt">تذكّرت كلمة المرور؟ <a href="login.html">عودة لتسجيل الدخول</a></div>
  </div>
</div>
<script>
var $=function(id){return document.getElementById(id);};
var EMAIL='';
var EMAIL_RE=/^[^\s@]+@[^\s@]+\.[^\s@]+$/;
function showMsg(t,cls){var m=$('msg');m.textContent=t;m.className='msg '+(cls||'err');}
function clearMsg(){var m=$('msg');m.textContent='';m.className='msg';}
function phase(n){
  ['p1','p2','p3'].forEach(function(p,i){$(p).classList.toggle('on',(i+1)===n);});
  $('st1').classList.toggle('on',n>=1);$('st2').classList.toggle('on',n>=2);$('st3').classList.toggle('on',n>=3);
  clearMsg();
}
function mapErr(e){
  if(e==='bad_email')return 'البريد الإلكتروني غير صالح.';
  if(e==='weak_password')return 'كلمة المرور قصيرة جداً (6 أحرف على الأقل).';
  if(e==='expired'||e==='otp_expired')return 'انتهت صلاحية الرمز. اطلب رمزاً جديداً.';
  if(e==='invalid'||e==='bad_code'||e==='mismatch')return 'الرمز غير صحيح.';
  if(e==='too_many'||e==='locked')return 'محاولات كثيرة. اطلب رمزاً جديداً.';
  if(e==='not_found')return 'لا يوجد حساب بهذا البريد.';
  return 'تعذّر إتمام العملية. حاول مجدداً.';
}
async function sendCode(){
  var email=$('email').value.trim().toLowerCase();
  if(!EMAIL_RE.test(email))return showMsg('الرجاء إدخال بريد إلكتروني صالح.');
  var b=$('btn1');b.disabled=true;b.textContent='جارٍ الإرسال...';
  try{
    var r=await fetch('/api/auth/forgot-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email})});
    var d=await r.json().catch(function(){return{};});
    if(!r.ok){showMsg(mapErr(d.error));b.disabled=false;b.textContent='إرسال الرمز';return;}
    EMAIL=email;$('emShow').textContent=email;
    phase(2);
    if(d.devCode){showMsg('وضع التطوير: الرمز '+d.devCode,'warn');$('code').value=d.devCode;}
    else showMsg('إن كان البريد مسجّلاً، فسيصلك رمز التحقق خلال دقائق.','ok');
    $('code').focus();
  }catch(e){showMsg('خطأ في الاتصال بالخادم.');}
  b.disabled=false;b.textContent='إرسال الرمز';
}
async function resendCode(){
  if(!EMAIL)return;
  var el=$('resend');el.style.pointerEvents='none';el.textContent='جارٍ الإرسال...';
  try{
    var r=await fetch('/api/auth/forgot-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:EMAIL})});
    var d=await r.json().catch(function(){return{};});
    if(d.devCode){showMsg('وضع التطوير: الرمز '+d.devCode,'warn');$('code').value=d.devCode;}
    else showMsg('تمّ إرسال رمز جديد إلى بريدك.','ok');
  }catch(e){showMsg('خطأ في الاتصال.');}
  var self=el;setTimeout(function(){self.style.pointerEvents='auto';self.textContent='إعادة إرسال الرمز';},1500);
}
function goPass(){
  var code=$('code').value.trim();
  if(!/^[0-9]{4,8}$/.test(code))return showMsg('أدخل رمز التحقق المكوّن من الأرقام.');
  phase(3);$('np1').focus();
}
async function doReset(){
  var code=$('code').value.trim();
  var p1=$('np1').value,p2=$('np2').value;
  if(p1.length<6)return showMsg('كلمة المرور يجب ألا تقل عن 6 أحرف.');
  if(p1!==p2)return showMsg('كلمتا المرور غير متطابقتين.');
  var b=$('btn3');b.disabled=true;b.textContent='جارٍ الحفظ...';
  try{
    var r=await fetch('/api/auth/reset-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:EMAIL,code:code,newPassword:p1})});
    var d=await r.json().catch(function(){return{};});
    if(!r.ok){
      showMsg(mapErr(d.error));b.disabled=false;b.textContent='حفظ كلمة المرور';
      if(d.error==='expired'||d.error==='otp_expired'||d.error==='invalid'||d.error==='bad_code'||d.error==='too_many'||d.error==='locked'){phase(2);}
      return;
    }
    showMsg('تمّت إعادة تعيين كلمة المرور بنجاح. جارٍ تحويلك لتسجيل الدخول...','ok');
    setTimeout(function(){location.replace('login.html');},1600);
  }catch(e){showMsg('خطأ في الاتصال بالخادم.');b.disabled=false;b.textContent='حفظ كلمة المرور';}
}
$('email').addEventListener('keydown',function(e){if(e.key==='Enter')sendCode();});
$('code').addEventListener('keydown',function(e){if(e.key==='Enter')goPass();});
$('np2').addEventListener('keydown',function(e){if(e.key==='Enter')doReset();});
</script>
</body>
</html>
