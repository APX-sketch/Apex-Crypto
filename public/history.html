<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080b12">
<meta name="robots" content="noindex,nofollow">
<title>Apex Crypto — الصفحة أُزيلت</title>
<link rel="icon" href="data:,">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{margin:0;background:radial-gradient(120% 80% at 50% 0%,#101827 0%,#080b12 60%,#05070c 100%);
    color:#e8eefc;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,"Noto Kufi Arabic",sans-serif;
    display:flex;align-items:center;justify-content:center;padding:24px 18px calc(24px + env(safe-area-inset-bottom))}
  .card{width:100%;max-width:390px;text-align:center;padding:34px 22px 26px;border-radius:22px;
    background:linear-gradient(180deg,rgba(24,32,48,.92),rgba(15,20,30,.94));
    border:1px solid rgba(255,255,255,.07);box-shadow:0 24px 60px rgba(0,0,0,.55)}
  .ic{width:64px;height:64px;margin:0 auto 16px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.35)}
  .ic svg{width:30px;height:30px;stroke:#f87171;stroke-width:2.4;fill:none;stroke-linecap:round}
  h1{font-size:18px;margin:0 0 10px;font-weight:800;letter-spacing:.2px}
  p{font-size:13.5px;line-height:1.85;color:#93a1bb;margin:0 0 8px}
  p b{color:#cfdcf5}
  .note{font-size:12px;color:#6f7f9c;margin-top:12px;line-height:1.7}
  .btns{display:flex;flex-direction:column;gap:9px;margin-top:22px}
  a.btn{display:block;text-decoration:none;padding:14px 16px;border-radius:14px;font-size:14px;font-weight:800}
  .primary{background:linear-gradient(135deg,#2563eb,#1d4ed8);color:#fff;box-shadow:0 10px 24px rgba(37,99,235,.32)}
  .ghost{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.09);color:#c6d4ee}
  a.btn:active{transform:scale(.985)}
</style>
</head>
<body>
  <main class="card">
    <div class="ic"><svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg></div>
    <h1>هذه الصفحة أُزيلت</h1>
    <p>لم يبقَ «سجل الحركات» العام على المنصّة.</p>
    <p>سجل حركاتك صار <b>خاصاً بمحفظتك</b> وحدك: تفتحه من المحفظة ← «سجل الحركات»، ويظهر فيه ما يخصّ حسابك فقط.</p>
    <p class="note">لأمانك: لا يعرض السجل أسماء الأطراف الأخرى كاملة — تُخفى تلقائياً.</p>
    <div class="btns">
      <a class="btn primary" href="/index.html">الرجوع إلى الرئيسية</a>
      <a class="btn ghost" href="/wallet.html">سجل حركات محفظتي</a>
    </div>
  </main>
</body>
</html>
