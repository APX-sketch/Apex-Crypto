<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<script>
(function(){try{var s=JSON.parse(localStorage.getItem('skygo_session')||'null');if(!s||!s.email){location.replace('login.html?next=history.html');}}catch(e){location.replace('login.html');}})();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Apex — سجل الحركات</title>
<style>
:root{--bg:#0b0e11;--panel:#141920;--panel2:#1c232c;--border:#252d38;--txt:#eef2f6;--muted:#8a94a3;--gold1:#f8d979;--gold2:#e0a615;--green:#0ecb81;--red:#f6465d}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Segoe UI',Tahoma,system-ui,sans-serif;background:var(--bg);color:var(--txt);max-width:480px;margin:0 auto;min-height:100vh}
.top{display:flex;align-items:center;gap:12px;padding:calc(16px + env(safe-area-inset-top)) 16px 14px;background:linear-gradient(135deg,#1b1f24,#12151a);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:5}
.top .bk{width:38px;height:38px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;background:var(--panel2);border:1px solid var(--border);border-radius:11px;cursor:pointer;font-size:20px;color:var(--txt);text-decoration:none}
.top b{font-size:16px;font-weight:800}
.tabs{display:flex;gap:8px;padding:14px 16px 4px}
.tab{flex:1;text-align:center;padding:9px 0;border-radius:11px;font-size:13px;font-weight:800;border:1px solid var(--border);background:var(--panel);color:var(--muted);cursor:pointer}
.tab.on{background:rgba(224,166,21,.14);color:var(--gold1);border-color:transparent}
.wrap{padding:10px 16px 40px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:6px 16px}
.row{display:flex;align-items:center;gap:12px;padding:14px 2px;border-top:1px solid var(--border)}
.row:first-of-type{border-top:0}
.row .ic{width:40px;height:40px;flex:0 0 auto;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:19px}
.row.in .ic{background:rgba(14,203,129,.12);color:var(--green)}
.row.out .ic{background:rgba(246,70,93,.12);color:var(--red)}
.row .tx{flex:1;min-width:0}
.row .tx b{display:block;font-size:14px}
.row .tx span{font-size:11px;color:var(--muted);direction:ltr}
.row .amt{font-weight:900;direction:ltr;font-size:14px}
.row.in .amt{color:var(--green)}
.row.out .amt{color:var(--red)}
.empty{padding:40px;text-align:center;color:var(--muted);font-size:13.5px}
</style>
<script src="i18n.js"></script>
</head>
<body>
<div class="top"><a class="bk" href="index.html">›</a><b>سجل الحركات</b></div>
<div class="tabs">
  <div class="tab on" data-f="all" onclick="setF('all')">الكل</div>
  <div class="tab" data-f="in" onclick="setF('in')">إيداعات</div>
  <div class="tab" data-f="out" onclick="setF('out')">تحويلات صادرة</div>
</div>
<div class="wrap"><div class="card" id="list"><div class="empty">…</div></div></div>
<script>
var $=function(id){return document.getElementById(id);};
var sess=JSON.parse(localStorage.getItem('skygo_session')||'{}');
var TOKEN=sess.token||localStorage.getItem('apex_token')||'';
var ITEMS=[],F='all';
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function fmt(n){n=Number(n)||0;return n.toLocaleString('en-US',{maximumFractionDigits:8});}
function fmtTime(ms){try{return new Date(ms).toLocaleString('ar',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});}catch(e){return '';}}
function setF(f){F=f;var ts=document.querySelectorAll('.tab');for(var i=0;i<ts.length;i++)ts[i].className='tab'+(ts[i].getAttribute('data-f')===f?' on':'');render();}
function render(){
  var arr=ITEMS.filter(function(x){return F==='all'||x.dir===F;});
  if(!arr.length){$('list').innerHTML='<div class="empty">لا توجد حركات</div>';return;}
  $('list').innerHTML=arr.map(function(x){
    var title=x.dir==='in'?('إيداع من '+(x.who||'تحويل داخلي')):('تحويل إلى '+(x.who||''));
    var sign=x.dir==='in'?'+':'-';
    return '<div class="row '+x.dir+'"><div class="ic">'+(x.dir==='in'?'↓':'↑')+'</div><div class="tx"><b>'+esc(title)+'</b><span>'+fmtTime(x.at)+'</span></div><div class="amt">'+sign+fmt(x.amount)+' '+esc(x.currency)+'</div></div>';
  }).join('');
}
async function load(){
  ITEMS=[];
  var outs=[];try{outs=JSON.parse(localStorage.getItem('apex_out_transfers')||'[]');}catch(e){outs=[];}
  outs.forEach(function(o){ITEMS.push({dir:'out',amount:o.amount,currency:o.currency,who:o.toName||o.to,at:o.at});});
  if(TOKEN){try{var r=await fetch('/api/wallet/me',{headers:{'Authorization':'Bearer '+TOKEN}});
    if(r.status===401){location.replace('login.html?next=history.html');return;}
    var d=await r.json();(d.deposits||[]).forEach(function(x){ITEMS.push({dir:'in',amount:x.amount,currency:x.currency,who:(x.kind==='admin'?'الإدارة':x.fromName),at:x.at});});
  }catch(e){}}
  ITEMS.sort(function(a,b){return b.at-a.at;});render();
}
load();setInterval(load,12000);
</script>
</body>
</html>
