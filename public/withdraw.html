<script>
(function(){try{var s=JSON.parse(localStorage.getItem('skygo_session')||'null');var t=(s&&s.token)||localStorage.getItem('apex_token')||'';if(!t){location.replace('login.html?next=withdraw.html');}}catch(e){location.replace('login.html?next=withdraw.html');}})();

<script>
/* عزل الحسابات: عند تبديل الحساب نمسح أي حالة محلية قديمة حتى يبدأ كل حساب من الصفر */
(function(){try{var ss=JSON.parse(localStorage.getItem('skygo_session')||'null')||{};var tok=(ss&&ss.token)||localStorage.getItem('apex_token')||'';var owner=(((ss&&ss.email)||'')+'').toLowerCase()||tok||'';if(!owner)return;var prev=localStorage.getItem('apex_acct_owner')||'';if(prev!==owner){var KEEP={'apex_lang':1,'apex_acct_owner':1,'apex_admin_token':1,'skygo_session':1,'apex_token':1,'apex_2fa':1,'apex_bio':1,'apex_hidebal':1,'apex_anti':1};var PFX=['skygo_wallet_','skygo_futures_','apex_apx','apex_fees_collected','apex_kyc_status','apex_favs_','apex_alerts_','apex_scan_addr','apex_sup_'];var kill=[];for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(!k||KEEP[k])continue;for(var j=0;j<PFX.length;j++){if(k.indexOf(PFX[j])===0){kill.push(k);break;}}}kill.forEach(function(k){try{localStorage.removeItem(k);}catch(e){}});localStorage.setItem('apex_acct_owner',owner);}}catch(e){}})();
</script>

<style>
:root{--bg:#0b0e11;--panel:#141920;--panel2:#1c232c;--border:#252d38;--txt:#eef2f6;--muted:#8a94a3;--gold1:#f8d979;--gold2:#e0a615;--green:#0ecb81;--red:#f6465d}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{font-family:'Segoe UI',Tahoma,system-ui,sans-serif;background:var(--bg);color:var(--txt);max-width:480px;margin:0 auto;min-height:100vh;position:relative;overflow-x:hidden;padding-bottom:40px}
input{font-size:16px}
.hdr{display:flex;align-items:center;gap:10px;padding:calc(12px + env(safe-area-inset-top)) 14px 12px;background:linear-gradient(135deg,#1b1f24,#0f1216);position:sticky;top:0;z-index:20;border-bottom:1px solid var(--border)}
.icobtn{width:38px;height:38px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;background:var(--panel2);border:1px solid var(--border);border-radius:11px;cursor:pointer;color:var(--txt)}
.icobtn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2}
.hdr h1{flex:1;font-size:17px;font-weight:900}
.hdr .to{font-size:12px;font-weight:800;color:var(--gold2);text-decoration:none}
.wrap{padding:16px 14px}
.lbl{font-size:12px;font-weight:800;color:var(--muted);margin:16px 4px 8px}
.coins{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.coins::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;display:flex;align-items:center;gap:7px;padding:9px 13px;border-radius:12px;background:var(--panel);border:1px solid var(--border);cursor:pointer;font-weight:800;font-size:13px}
.chip img{width:20px;height:20px;border-radius:50%}
.chip.sel{border-color:var(--gold2);background:rgba(224,166,21,.1)}
.nets{display:flex;flex-direction:column;gap:8px}
.net{display:flex;align-items:center;gap:11px;padding:12px 14px;border-radius:13px;background:var(--panel);border:1px solid var(--border);cursor:pointer}
.net .nt{flex:1}
.net .nt b{display:block;font-size:13.5px;font-weight:800}
.net .nt span{font-size:11px;color:var(--muted)}
.net .rd{width:18px;height:18px;border-radius:50%;border:2px solid var(--border);flex:0 0 auto}
.net.sel{border-color:var(--gold2);background:rgba(224,166,21,.08)}
.net.sel .rd{border-color:var(--gold2);background:radial-gradient(circle,var(--gold2) 0 5px,transparent 6px)}
.card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:16px;margin-top:8px}
.amtbox{display:flex;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--border);border-radius:14px;padding:14px 15px}
.amtbox input{flex:1;background:none;border:0;color:var(--txt);font-family:inherit;font-size:22px;font-weight:900;outline:none;min-width:0}
.amtbox .cur{font-size:14px;font-weight:800;color:var(--muted)}
.amtbox .max{background:rgba(224,166,21,.12);color:var(--gold2);border:0;font-family:inherit;font-weight:800;font-size:12px;padding:6px 11px;border-radius:9px;cursor:pointer}
.quick{display:flex;gap:8px;margin-top:10px}
.quick button{flex:1;background:var(--panel2);border:1px solid var(--border);color:var(--txt);font-family:inherit;font-weight:800;font-size:12px;padding:9px 0;border-radius:10px;cursor:pointer}
.quick button:active{background:var(--border)}
.field{width:100%;background:var(--panel2);border:1px solid var(--border);border-radius:12px;color:var(--txt);font-family:inherit;font-size:14px;padding:13px 14px;outline:none}
.field:focus{border-color:var(--gold2)}
.rowinfo{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);padding:6px 4px}
.rowinfo b{color:var(--txt);font-weight:800}
.note{display:flex;gap:9px;background:rgba(224,166,21,.07);border:1px solid rgba(224,166,21,.25);border-radius:12px;padding:12px 13px;margin-top:14px;font-size:12px;color:#d9c48d;line-height:1.6}
.note svg{width:17px;height:17px;flex:0 0 auto;stroke:var(--gold2);fill:none;stroke-width:2;margin-top:1px}
.btn{width:100%;border:0;border-radius:14px;font-family:inherit;font-size:16px;font-weight:900;padding:16px 0;margin-top:22px;cursor:pointer;background:linear-gradient(135deg,var(--gold1),var(--gold2));color:#231a02}
.btn:active{transform:scale(.98)}
.btn.dis{opacity:.5;pointer-events:none}
.toast{position:fixed;bottom:40px;left:50%;transform:translate(-50%,20px);background:#20272f;color:#fff;padding:12px 18px;border-radius:12px;font-size:13px;font-weight:700;opacity:0;transition:.3s;z-index:99;pointer-events:none;border:1px solid var(--border);max-width:88%;text-align:center}
.toast.show{transform:translate(-50%,0);opacity:1}
.toast.err{border-color:var(--red);color:#ffd7dd}
.toast.ok{border-color:var(--green);color:#c8f7e3}
</style>

<body>
<div class="hdr">
  <div class="icobtn" onclick="location.href='wallet.html'"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></div>
  <h1>سحب</h1>
  <a class="to" href="history.html">السجل ›</a>
</div>
<div class="wrap">
  <div class="lbl">اختر العملة</div>
  <div class="coins" id="coins"></div>

  <div class="lbl">الشبكة</div>
  <div class="nets" id="nets"></div>

  <div class="lbl">المبلغ</div>
  <div class="card">
    <div class="amtbox">
      <input id="amt" type="text" inputmode="decimal" placeholder="0.00" oninput="onAmt()">
      <span class="cur" id="curLbl">USDT</span>
      <button class="max" onclick="setMax()">الأقصى</button>
    </div>
    <div class="quick">
      <button onclick="setPct(.25)">25%</button>
      <button onclick="setPct(.5)">50%</button>
      <button onclick="setPct(.75)">75%</button>
      <button onclick="setPct(1)">100%</button>
    </div>
    <div class="rowinfo"><span>الرصيد المتاح</span><b id="curBal">0.00</b></div>
    <div class="rowinfo"><span>القيمة التقديرية</span><b id="estVal">≈ $0.00</b></div>
  </div>

  <div class="lbl">عنوان السحب (شبكة تجريبية)</div>
  <input class="field" id="wAddr" type="text" placeholder="أدخل عنوان المحفظة" oninput="onAmt()" autocomplete="off">

  <div class="note"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v4h1"/></svg>
    <span>الرصيد والسحب يُداران على السيرفر. كل حساب له رصيده المستقل، ويُخصم المبلغ من رصيد السيرفر بعد التحقق.</span></div>

  <button class="btn dis" id="submitBtn" onclick="startWithdraw()">تأكيد السحب</button>
</div>
<div class="toast" id="toast"></div>

<!-- طبقة تأكيد OTP -->
<div id="otpOv" style="position:fixed;inset:0;z-index:9998;display:none;background:rgba(0,0,0,.55);backdrop-filter:blur(3px)">
  <div id="otpSheet" style="position:absolute;left:0;right:0;bottom:0;background:var(--panel,#1b1f24);border-top-left-radius:22px;border-top-right-radius:22px;padding:22px 20px 30px;max-width:480px;margin:0 auto;box-shadow:0 -8px 30px rgba(0,0,0,.4)">
    <div style="width:42px;height:4px;border-radius:4px;background:var(--border,#333);margin:0 auto 18px"></div>
    <h3 style="margin:0 0 6px;font-size:18px;font-weight:900;color:var(--txt,#fff);text-align:center">تأكيد السحب</h3>
    <p style="margin:0 0 4px;font-size:13px;color:var(--mut,#9aa);text-align:center">أرسلنا رمزاً مكوّناً من 6 أرقام إلى بريدك</p>
    <p id="otpEmail" style="margin:0 0 16px;font-size:12px;color:var(--gold2,#f0b90b);text-align:center;direction:ltr"></p>
    <div id="otpDev" style="display:none;margin:0 0 14px;font-size:13px;color:#8fd;text-align:center;background:rgba(0,180,120,.12);border-radius:10px;padding:8px"></div>
    <input id="otpInput" type="text" inputmode="numeric" maxlength="6" placeholder="______" autocomplete="one-time-code"
      style="width:100%;box-sizing:border-box;text-align:center;letter-spacing:12px;font-size:26px;font-weight:900;padding:14px 0;border-radius:14px;border:1px solid var(--border,#333);background:var(--panel2,#0f1216);color:var(--txt,#fff);direction:ltr" oninput="otpOnInput()">
    <div style="display:flex;justify-content:space-between;align-items:center;margin:12px 2px 0">
      <button id="otpResend" onclick="requestOtp(true)" style="background:none;border:0;color:var(--gold2,#f0b90b);font-family:inherit;font-size:13px;font-weight:700;cursor:pointer">إعادة الإرسال</button>
      <span id="otpTimer" style="font-size:12px;color:var(--mut,#9aa)"></span>
    </div>
    <button class="btn dis" id="otpConfirm" onclick="confirmWithdraw()">تأكيد</button>
    <button onclick="closeOtp()" style="width:100%;margin-top:10px;background:none;border:0;color:var(--mut,#9aa);font-family:inherit;font-size:14px;cursor:pointer">إلغاء</button>
  </div>
</div>
<script>
const $=id=>document.getElementById(id);
const fmt=(n,d=2)=>Number(n).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
function toast(m,t){var e=$('toast');e.textContent=m;e.className='toast show '+(t||'');setTimeout(function(){e.className='toast '+(t||'');},2400);}
function icoUrl(b){return 'https://cdn.jsdelivr.net/gh/atomiclabs/cryptocurrency-icons@1a63530be6e374711a8554f31b17e4cb92c25fa5/128/color/'+b.toLowerCase()+'.png';}

/* === الرصيد والأسعار من السيرفر فقط — لا localStorage وهمي، ولا اتصال مباشر بباينانس === */
const SESS=(function(){try{return JSON.parse(localStorage.getItem('skygo_session')||'null')||{};}catch(e){return {};}})();
const TOKEN=(SESS&&SESS.token)||localStorage.getItem('apex_token')||'';
function authHeaders(extra){var h=extra||{};h['Authorization']='Bearer '+TOKEN;return h;}
function logout(){location.replace('login.html?next=withdraw.html');}

const CATALOG=['USDT','BTC','ETH','BNB','SOL','XRP','ADA','DOGE','TRX','LTC'];
const NETWORKS={
  USDT:[['TRC20','TRON (TRC20)','≈ 1 USDT رسوم — الأسرع والأرخص'],['BEP20','BNB Smart Chain (BEP20)','رسوم منخفضة'],['ERC20','Ethereum (ERC20)','رسوم شبكة أعلى'],['MATIC','Polygon','رسوم منخفضة'],['ARBITRUM','Arbitrum One',''],['OP','Optimism',''],['SOL','Solana','']],
  USDC:[['ERC20','Ethereum (ERC20)',''],['BEP20','BNB Smart Chain (BEP20)',''],['MATIC','Polygon',''],['ARBITRUM','Arbitrum One',''],['OP','Optimism',''],['SOL','Solana','']],
  BTC:[['BTC','Bitcoin','الشبكة الأصلية'],['BEP20','BNB Smart Chain (BEP20)','BTCB'],['LIGHTNING','Lightning Network','فوري']],
  ETH:[['ERC20','Ethereum (ERC20)','الشبكة الأصلية'],['BEP20','BNB Smart Chain (BEP20)',''],['ARBITRUM','Arbitrum One',''],['OP','Optimism','']],
  BNB:[['BEP20','BNB Smart Chain (BEP20)','الموصى به'],['BEP2','BNB Beacon Chain (BEP2)','']],
  SOL:[['SOL','Solana','الشبكة الأصلية'],['BEP20','BNB Smart Chain (BEP20)','']],
  XRP:[['XRP','XRP Ledger','يتطلّب Memo/Tag'],['BEP20','BNB Smart Chain (BEP20)','']],
  ADA:[['ADA','Cardano','الشبكة الأصلية'],['BEP20','BNB Smart Chain (BEP20)','']],
  DOGE:[['DOGE','Dogecoin','الشبكة الأصلية'],['BEP20','BNB Smart Chain (BEP20)','']],
  TRX:[['TRC20','TRON (TRC20)','الشبكة الأصلية'],['BEP20','BNB Smart Chain (BEP20)','']],
  LTC:[['LTC','Litecoin','الشبكة الأصلية'],['BEP20','BNB Smart Chain (BEP20)','']]
};
function netsFor(b){return NETWORKS[b]||[['BEP20','BNB Smart Chain (BEP20)',''],['ERC20','Ethereum (ERC20)','']];}
var selNet='';
function renderNets(){
  var list=netsFor(sel);
  if(!list.some(function(n){return n[0]===selNet;}))selNet=list[0][0];
  $('nets').innerHTML=list.map(function(n){
    return '<div class="net'+(n[0]===selNet?' sel':'')+'" onclick="pickNet(\''+n[0]+'\')"><div class="rd"></div><div class="nt"><b>'+n[0]+'</b><span>'+n[1]+(n[2]?' · '+n[2]:'')+'</span></div></div>';
  }).join('');
}
function pickNet(code){selNet=code;renderNets();}
var wallet={}, locked={}, priceMap={}, sel='USDT';
function priceOf(b){return b==='USDT'?1:(priceMap[b+'USDT']||0);}
function avail(b){return Math.max(0,(Number(wallet[b])||0)-(Number(locked[b])||0));}

function renderCoins(){
  $('coins').innerHTML=CATALOG.map(function(b){
    return '<div class="chip'+(b===sel?' sel':'')+'" onclick="pickCoin(\''+b+'\')">'+
      '<img src="'+icoUrl(b)+'" onerror="this.style.display=\'none\'">'+b+'</div>';
  }).join('');
}
function syncBal(){$('curBal').textContent=fmt(avail(sel),avail(sel)>=1?4:6);}
function pickCoin(b){sel=b;renderCoins();$('curLbl').textContent=b;syncBal();$('amt').value='';renderNets();onAmt();}
function setMax(){$('amt').value=avail(sel);onAmt();}
function setPct(p){var bal=avail(sel);var v=bal*p;$('amt').value=p===1?bal:parseFloat(v.toFixed(bal>=1?6:8));onAmt();}
function onAmt(){
  var v=parseFloat($('amt').value)||0;
  var bal=avail(sel);
  $('estVal').textContent='≈ $'+fmt(v*priceOf(sel),2);
  var addr=($('wAddr').value||'').trim();
  var ok=v>0 && v<=bal && addr.length>=6;
  $('submitBtn').className='btn'+(ok?'':' dis');
}

async function refreshWallet(){
  if(!TOKEN){logout();return;}
  try{
    var r=await fetch('/api/wallet/me',{headers:authHeaders()});
    if(r.status===401||r.status===403){logout();return;}
    if(!r.ok)return;
    var d=await r.json();
    wallet={};var b=d.balances||{};for(var k in b){wallet[String(k).toUpperCase()]=Number(b[k])||0;}
    locked={};var l=d.locked||{};for(var k2 in l){locked[String(k2).toUpperCase()]=Number(l[k2])||0;}
    syncBal();onAmt();
  }catch(e){}
}

var _pendingWd=null, _otpTimer=null;

// الخطوة 1: التحقق من المدخلات ثم طلب رمز OTP
async function startWithdraw(){
  var v=parseFloat($('amt').value)||0;
  var bal=avail(sel);
  var addr=($('wAddr').value||'').trim();
  if(v<=0){toast('أدخل مبلغاً صحيحاً','err');return;}
  if(v>bal){toast('الرصيد غير كافٍ','err');return;}
  if(addr.length<6){toast('أدخل عنوان محفظة صحيح','err');return;}
  _pendingWd={amount:v,currency:sel,address:addr,network:selNet};
  await requestOtp(false);
}

function openOtp(){$('otpOv').style.display='block';$('otpInput').value='';otpOnInput();setTimeout(function(){try{$('otpInput').focus();}catch(e){}},200);}
function closeOtp(){$('otpOv').style.display='none';if(_otpTimer){clearInterval(_otpTimer);_otpTimer=null;}onAmt();}
function otpOnInput(){var c=($('otpInput').value||'').replace(/\D/g,'').slice(0,6);$('otpInput').value=c;$('otpConfirm').className='btn'+(c.length===6?'':' dis');}

// الخطوة 2: طلب الرمز من السيرفر
async function requestOtp(isResend){
  if(!_pendingWd)return;
  $('submitBtn').className='btn dis';
  try{
    var r=await fetch('/api/wallet/withdraw/request-otp',{method:'POST',headers:authHeaders({'Content-Type':'application/json'}),body:JSON.stringify(_pendingWd)});
    if(r.status===401){logout();return;}
    var d=await r.json().catch(function(){return {};});
    if(r.status===403&&(d.error==='account_not_approved'||d.error==='banned')){toast(d.error==='banned'?'الحساب محظور':'حسابك قيد المراجعة — السحب متاح بعد التوثيق','err');onAmt();return;}
    if(!r.ok){toast('تعذّر إرسال رمز التأكيد','err');onAmt();return;}
    $('otpEmail').textContent=d.email||'';
    if(d.devCode){$('otpDev').style.display='block';$('otpDev').textContent='رمز الاختبار: '+d.devCode;}else{$('otpDev').style.display='none';}
    if(!isResend)openOtp();
    startOtpTimer(d.expiresInSec||300);
    toast(isResend?'أُعيد إرسال الرمز':'أُرسِل رمز التأكيد','ok');
  }catch(e){toast('تعذّر الاتصال بالسيرفر','err');onAmt();}
}

function startOtpTimer(sec){
  if(_otpTimer)clearInterval(_otpTimer);
  var left=sec;var rs=$('otpResend');rs.style.opacity='.5';rs.style.pointerEvents='none';
  function tick(){
    var m=Math.floor(left/60),s=left%60;
    $('otpTimer').textContent='صالح '+m+':'+(s<10?'0':'')+s;
    if(left<=0){clearInterval(_otpTimer);_otpTimer=null;$('otpTimer').textContent='انتهى الرمز';rs.style.opacity='1';rs.style.pointerEvents='auto';}
    left--;
  }
  tick();_otpTimer=setInterval(tick,1000);
}

// الخطوة 3: تنفيذ السحب مع الرمز
async function confirmWithdraw(){
  if(!_pendingWd)return;
  var otp=($('otpInput').value||'').replace(/\D/g,'');
  if(otp.length!==6){toast('أدخل الرمز المكوّن من 6 أرقام','err');return;}
  $('otpConfirm').className='btn dis';
  try{
    var payload=Object.assign({},_pendingWd,{otp:otp});
    var r=await fetch('/api/wallet/withdraw',{method:'POST',headers:authHeaders({'Content-Type':'application/json'}),body:JSON.stringify(payload)});
    if(r.status===401){logout();return;}
    var d=await r.json().catch(function(){return {};});
    if(r.status===403&&(d.error==='account_not_approved'||d.error==='banned')){toast(d.error==='banned'?'الحساب محظور':'حسابك قيد المراجعة','err');return;}
    if(!r.ok){
      var map={otp_required:'اطلب رمز التأكيد أولاً',otp_expired:'انتهى الرمز — أعد الإرسال',otp_invalid:'الرمز غير صحيح',otp_locked:'محاولات كثيرة — أعد الإرسال',insufficient_balance:'الرصيد غير كافٍ',invalid_amount:'مبلغ غير صالح'};
      var msg=map[d.error]||'تعذّر تنفيذ السحب';
      toast(msg,'err');
      if(d.error==='otp_invalid'){$('otpConfirm').className='btn';$('otpInput').value='';otpOnInput();return;}
      if(d.error==='otp_expired'||d.error==='otp_locked'||d.error==='otp_required'){return;}
      closeOtp();return;
    }
    var v=_pendingWd.amount;
    if(d.balances){wallet={};for(var k in d.balances){wallet[String(k).toUpperCase()]=Number(d.balances[k])||0;}syncBal();}
    var okMsg;
    if(d.delivered&&d.recipientName){okMsg='تم تحويل '+fmt(v,v>=1?4:6)+' '+sel+' إلى '+d.recipientName+' ✓ وصلت لحسابه';}
    else if(d.delivered){okMsg='تم تحويل '+fmt(v,v>=1?4:6)+' '+sel+' ✓ وصلت للحساب المستلم';}
    else{okMsg='تم سحب '+fmt(v,v>=1?4:6)+' '+sel+' إلى عنوان خارجي';}
    closeOtp();toast(okMsg,'ok');
    setTimeout(function(){location.href='wallet.html';},1400);
  }catch(e){toast('تعذّر الاتصال بالسيرفر','err');$('otpConfirm').className='btn';}
}

async function loadPrices(){
  try{
    var r=await fetch('/api/markets',{headers:{'Accept':'application/json'}});
    if(!r.ok)return;
    var arr=await r.json();
    if(Array.isArray(arr)){arr.forEach(function(d){if(d&&d.symbol){priceMap[d.symbol]=parseFloat(d.lastPrice!=null?d.lastPrice:d.price);}});}
    onAmt();
  }catch(e){}
}

(function initAddr(){try{var a=localStorage.getItem('apex_scan_addr');if(a){$('wAddr').value=a;localStorage.removeItem('apex_scan_addr');}var q=new URLSearchParams(location.search).get('addr');if(q&&!$('wAddr').value)$('wAddr').value=q;}catch(e){}})();
renderCoins(); pickCoin('USDT'); refreshWallet(); loadPrices();
setInterval(refreshWallet,8000); setInterval(loadPrices,10000);
</script>
</body>
