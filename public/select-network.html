<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apex Crypto - اختيار شبكة الإيداع</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #070a13;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            direction: rtl;
            color: #f8fafc;
        }

        .app-container {
            width: 100%;
            max-width: 400px;
            height: 840px;
            background: #0f172a;
            border-radius: 35px;
            border: 4px solid #1e293b;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        .app-header {
            padding: 20px 16px 12px 16px;
            background: #0f172a;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .back-btn {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #38bdf8;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            text-decoration: none;
            font-size: 16px;
        }

        .app-header h2 {
            font-size: 16px;
            color: #fff;
            margin-bottom: 2px;
        }
        .app-header p {
            font-size: 11px;
            color: #94a3b8;
        }

        .app-content {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }

        .section-label {
            font-size: 12px;
            color: #94a3b8;
            margin-bottom: 12px;
            font-weight: bold;
        }

        .network-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .network-card {
            background: #111827;
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: 0.2s;
            text-decoration: none;
            color: inherit;
        }

        .network-card:hover {
            border-color: #38bdf8;
            background: #1e293b;
        }

        .net-info h3 {
            font-size: 14px;
            color: #fff;
            margin-bottom: 4px;
        }
        .net-info p {
            font-size: 11px;
            color: #94a3b8;
        }

        .net-badge {
            background: rgba(56, 189, 248, 0.1);
            color: #38bdf8;
            padding: 5px 12px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: bold;
        }

        /* شريط التنقل السفلي */
        .bottom-nav {
            height: 60px;
            background: rgba(15, 23, 42, 0.95);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            justify-content: space-around;
            align-items: center;
            width: 100%;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: #94a3b8;
            font-size: 9px;
            gap: 3px;
        }
        .nav-item.active {
            color: #38bdf8;
        }
        .nav-item svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <div class="app-header">
            <a href="wallet.html" class="back-btn">&rarr;</a>
            <div>
                <h2>اختر شبكة الإيداع</h2>
                <p>حدد شبكة التحويل الخاصة بعلمة USDT</p>
            </div>
        </div>

        <div class="app-content">
            <div class="section-label">الشبكات المتاحة</div>
            
            <div class="network-list">
                <!-- اختيار TRC20 -->
                <a href="deposit.html?network=TRC20" class="network-card">
                    <div class="net-info">
                        <h3>Tron (TRC20)</h3>
                        <p>رسوم تحويل منخفضة وسريعة</p>
                    </div>
                    <div class="net-badge">موصى به</div>
                </a>

                <!-- شبكات إضافية اختيارية -->
                <a href="deposit.html?network=ERC20" class="network-card" onclick="event.preventDefault(); alert('هذه الشبكة قيد الصيانة حالياً، يختار المستخدم TRC20');">
                    <div class="net-info" style="opacity: 0.5;">
                        <h3>Ethereum (ERC20)</h3>
                        <p>رسوم تحويل عالية</p>
                    </div>
                </a>
            </div>
        </div>

        <div class="bottom-nav">
            <a href="index.html" class="nav-item">
                <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
                الرئيسية
            </a>
            <a href="mining.html" class="nav-item">
                <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
                التعدين
            </a>
            <a href="trading.html" class="nav-item">
                <svg viewBox="0 0 24 24"><path d="M3.5 18.49l6-6.01 4 4L22 6.92l-1.41-1.41-7.09 7.97-4-4L2 16.99z"/></svg>
                التداول
            </a>
            <a href="wallet.html" class="nav-item active">
                <svg viewBox="0 0 24 24"><path d="M21 18v1c0 1.1-.9 2-2 2H5c-1.11 0-2-.9-2-2V5c0-1.1.89-2 2-2h14c1.1 0 2 .9 2 2v1h-9c-1.11 0-2 .9-2 2v8c0 1.1.89 2 2 2h9zm-9-2h10V8H12v8zm4-2.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>
                الأصول
            </a>
            <a href="support.html" class="nav-item">
                <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
                الدعم
            </a>
        </div>
    </div>
</body>
</html>
