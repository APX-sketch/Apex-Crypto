<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Apex — Square</title>
<style>
:root{--bg:#0b0e11;--panel:#141920;--panel2:#1c232c;--border:#252d38;--txt:#eef2f6;--muted:#8a94a3;--gold1:#f8d979;--gold2:#e0a615;--green:#0ecb81;--red:#f6465d;}
html[data-theme=light]{--bg:#f6f8fb;--panel:#ffffff;--panel2:#eef1f6;--border:#e2e7ef;--txt:#0d1421;--muted:#6b7686;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Segoe UI',Tahoma,system-ui,sans-serif;background:var(--bg);color:var(--txt);max-width:480px;margin:0 auto;padding-bottom:76px;min-height:100vh;position:relative;overflow-x:hidden}
.hdr{display:flex;align-items:center;gap:10px;padding:calc(12px + env(safe-area-inset-top)) 14px 10px;background:linear-gradient(135deg,#1b1f24,#0f1216);position:sticky;top:0;z-index:20;border-bottom:1px solid var(--border)}
html[data-theme=light] .hdr{background:linear-gradient(135deg,#fff,#eef1f6)}
.hdr .brand{font-size:20px;font-weight:900;letter-spacing:.5px}
.hdr .bkbtn{width:32px;height:32px;flex:0 0 auto;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--panel2);border:1px solid var(--border);color:var(--txt);text-decoration:none;font-size:19px;line-height:1;padding-bottom:2px}
.hdr .brand b{background:linear-gradient(90deg,var(--gold1),var(--gold2));-webkit-background-clip:text;background-clip:text;color:transparent}
.hsearch{flex:1;display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--border);border-radius:11px;padding:0 12px;height:36px}
.hsearch svg{width:15px;height:15px;stroke:var(--muted);fill:none;stroke-width:2}
.hsearch input{flex:1;background:none;border:0;color:var(--txt);font-family:inherit;font-size:13px;outline:none}
.hsearch input::placeholder{color:#5c6675}
.chips{display:flex;gap:8px;padding:12px 14px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--border)}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:7px 15px;border-radius:999px;background:var(--panel);border:1px solid var(--border);color:var(--muted);font-size:12.5px;font-weight:800;cursor:pointer;white-space:nowrap;font-family:inherit}
.chip.active{background:linear-gradient(135deg,var(--gold1),var(--gold2));color:#231a02;border-color:transparent}
.kbd{display:inline-block;font-style:normal;font-size:9.5px;font-weight:900;padding:2px 6px;border-radius:5px;margin-inline-end:5px;vertical-align:1px}
.kbd.news{color:#63b3ff;background:rgba(47,131,251,.13);border:1px solid rgba(47,131,251,.3)}
.kbd.ads{color:var(--gold1);background:rgba(224,166,21,.13);border:1px solid rgba(224,166,21,.3)}
.kbd.ana{color:var(--green);background:rgba(14,203,129,.11);border:1px solid rgba(14,203,129,.28)}
.feed{padding:4px 0}
.post{padding:14px;border-bottom:8px solid rgba(0,0,0,.18)}
html[data-theme=light] .post{border-bottom:8px solid #e9edf3}
.phead{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.av{width:42px;height:42px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:17px;color:#fff}
.who{flex:1;min-width:0}
.who b{font-size:14px;font-weight:800;display:flex;align-items:center;gap:4px}
.who b .vf{width:14px;height:14px;fill:var(--gold2)}
.vchk{width:15px;height:15px;flex:0 0 auto;vertical-align:-2px}
.av.ofc{background:linear-gradient(135deg,var(--gold1),var(--gold2))!important;color:#231a02!important;box-shadow:0 0 0 2px rgba(224,166,21,.28)}
.av.vfy-b{box-shadow:0 0 0 2px rgba(29,155,240,.45)}
.av.vfy-g{box-shadow:0 0 0 2px rgba(224,166,21,.55)}
@keyframes sqIn{from{opacity:.15;transform:translateY(26px)}to{opacity:1;transform:none}}
body{animation:sqIn .26s ease-out}
@media (prefers-reduced-motion: reduce){body{animation:none}}
.who span{font-size:11.5px;color:var(--muted);display:block}
.delbtn{flex:0 0 auto;width:30px;height:30px;border-radius:50%;border:1px solid rgba(246,70,93,.35);background:rgba(246,70,93,.08);color:#f6465d;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;transition:background .15s,transform .15s}
.delbtn:hover{background:rgba(246,70,93,.2);transform:scale(1.06)}
.delbtn svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.follow{flex:0 0 auto;padding:6px 14px;border-radius:999px;border:1px solid var(--gold2);background:none;color:var(--gold2);font-size:12px;font-weight:800;cursor:pointer;font-family:inherit}
.follow.on{background:var(--panel2);border-color:var(--border);color:var(--muted)}
.ptext{font-size:14px;line-height:1.75;white-space:pre-wrap;word-break:break-word}
.ptext .cashtag{color:var(--gold2);font-weight:800}
.ptext .hashtag{color:#2f83fb;font-weight:800;cursor:pointer}
html[data-theme=light] .ptext .hashtag{color:#1a66d6}
.ptext .up{color:var(--green);font-weight:800}
.ptext .dn{color:var(--red);font-weight:800}
.statlink{flex:0 0 auto;width:36px;height:36px;border-radius:11px;background:var(--panel2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--gold2);cursor:pointer;text-decoration:none}
.statlink svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.9}
.trends{display:flex;gap:8px;padding:10px 14px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--border);align-items:center}
.trends::-webkit-scrollbar{display:none}
.trends .tlabel{flex:0 0 auto;font-size:11.5px;font-weight:800;color:var(--muted);margin-left:2px}
.trend{flex:0 0 auto;padding:6px 13px;border-radius:999px;background:var(--panel);border:1px solid var(--border);color:#2f83fb;font-size:12.5px;font-weight:800;cursor:pointer;white-space:nowrap;font-family:inherit}
.trend b{color:var(--muted);font-weight:700;margin-right:5px;font-size:11px}
.tagbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;background:var(--panel2);border-bottom:1px solid var(--border)}
.tagbar b{font-size:13.5px;color:var(--txt);font-weight:900}
.tagbar .clr{padding:6px 13px;border-radius:999px;border:1px solid var(--border);background:var(--panel);color:var(--muted);font-size:12px;font-weight:800;cursor:pointer;font-family:inherit}
.pimg{margin-top:10px;width:100%;border-radius:12px;display:block}
.pchart{margin-top:10px;height:120px;border-radius:12px;background:linear-gradient(180deg,rgba(14,203,129,.12),transparent);border:1px solid var(--border);display:flex;align-items:flex-end;gap:3px;padding:10px;overflow:hidden}

.pchart i{flex:1;border-radius:2px 2px 0 0;background:linear-gradient(180deg,var(--green),rgba(14,203,129,.35))}
/* زر النقاط الثلاث + قائمة الخيارات */
.morebtn{flex:0 0 auto;width:30px;height:30px;border-radius:50%;border:1px solid transparent;background:none;color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;transition:background .15s,color .15s}
.morebtn:hover,.morebtn:focus-visible{background:var(--panel2);color:var(--txt)}
.morebtn svg{width:18px;height:18px;fill:currentColor;stroke:none}
.menu{position:fixed;z-index:80;min-width:196px;background:var(--panel);border:1px solid var(--border);border-radius:13px;padding:6px;box-shadow:0 14px 40px rgba(0,0,0,.45);display:none;animation:pop .13s ease}
html[data-theme=light] .menu{box-shadow:0 14px 40px rgba(15,25,45,.18)}
.menu.on{display:block}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
.menu button{display:flex;align-items:center;gap:10px;width:100%;padding:10px 11px;border:0;background:none;color:var(--txt);font-size:13px;font-weight:700;font-family:inherit;cursor:pointer;border-radius:9px;text-align:start}
.menu button:hover{background:var(--panel2)}
.menu button svg{width:17px;height:17px;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.menu button.chosen{color:var(--gold2)}
.menu button.danger{color:#f6465d}
.menu .sep{height:1px;background:var(--border);margin:5px 4px}
/* شارات الحالة على المنشور (محفوظ / مهتم) */
.vbadge{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:999px;margin-right:6px;vertical-align:middle}
.vbadge.up{background:rgba(14,203,129,.14);color:var(--green)}
.vbadge.down{background:rgba(246,70,93,.13);color:#f6465d}
.vbadge.sv{background:rgba(224,166,21,.16);color:var(--gold2)}
/* شريط «أعاد النشر بواسطة …» */
.rpbar{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:800;color:var(--green);margin:0 0 8px 2px}
.rpbar svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2}
.rpbar b{color:var(--txt);font-weight:800}
.rpbar .rpn{font-size:10px;font-weight:800;color:var(--green);background:rgba(14,203,129,.14);padding:1px 6px;border-radius:999px}
.rpquote{border:1px solid var(--border);background:var(--panel2);border-radius:12px;padding:10px 12px;margin:0 0 10px;font-size:12.5px;color:var(--muted);line-height:1.65}
.msep{height:1px;background:var(--border);margin:5px 4px}
.reasonwrap{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px}
.reasonwrap .rs{padding:8px 13px;border-radius:999px;border:1px solid var(--border);background:var(--panel2);color:var(--muted);font-size:12.5px;font-weight:800;cursor:pointer;font-family:inherit}
.reasonwrap .rs.sel{border-color:#f6465d;color:#f6465d;background:rgba(246,70,93,.1)}
</style>
</head>
<body>
<style>
.pacts{display:flex;align-items:center;justify-content:space-between;margin-top:12px;color:var(--muted);max-width:360px}
.pact{display:flex;align-items:center;gap:6px;cursor:pointer;font-size:12.5px;font-weight:700;transition:color .15s}
.pact svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8}
.pact.liked{color:var(--red)}
.pact.liked svg{fill:var(--red);stroke:var(--red)}
.pact.reposted{color:var(--green)}
.pact.reposted svg{stroke:var(--green)}
.pact.shared{color:var(--green)}
.statrow{display:flex;align-items:center;gap:12px;padding:13px 4px;border-bottom:1px solid var(--border)}
.statrow:last-child{border-bottom:0}
.statrow .si{font-size:20px;width:28px;text-align:center}
.statrow .sl{flex:1;font-size:14px;font-weight:700}
.statrow .sn{font-size:17px;font-weight:900;color:var(--gold2)}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(10px);background:var(--panel2);color:var(--txt);border:1px solid var(--border);padding:11px 18px;border-radius:12px;font-size:13px;font-weight:700;z-index:60;opacity:0;pointer-events:none;transition:.25s;white-space:nowrap;max-width:90%;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
/* ===== تنبيه النجاح (إعادة النشر) ===== */
.okband{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top));transform:translateX(-50%) translateY(-18px) scale(.96);display:flex;align-items:center;gap:9px;max-width:92%;padding:11px 16px;border-radius:14px;background:linear-gradient(135deg,rgba(34,197,94,.22),rgba(34,197,94,.10));border:1px solid rgba(34,197,94,.55);color:#eafff2;font-size:13px;font-weight:800;z-index:80;opacity:0;pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.4),0 0 0 0 rgba(34,197,94,.45);transition:opacity .22s ease,transform .28s cubic-bezier(.22,1.2,.36,1)}
.okband.on{opacity:1;transform:translateX(-50%) translateY(0) scale(1);animation:okPulse 1.1s ease-out .12s 1}
.okband .okic{width:22px;height:22px;border-radius:50%;background:rgba(34,197,94,.9);display:flex;align-items:center;justify-content:center;flex:0 0 auto;animation:okPop .38s cubic-bezier(.22,1.4,.36,1) both}
.okband .okic svg{width:13px;height:13px;stroke:#04150b;stroke-width:3.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.okband .okic svg path{stroke-dasharray:20;stroke-dashoffset:20;animation:okDraw .34s ease-out .12s forwards}
@keyframes okPop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes okDraw{to{stroke-dashoffset:0}}
@keyframes okPulse{0%{box-shadow:0 10px 30px rgba(0,0,0,.4),0 0 0 0 rgba(34,197,94,.5)}100%{box-shadow:0 10px 30px rgba(0,0,0,.4),0 0 0 16px rgba(34,197,94,0)}}
@media (prefers-reduced-motion: reduce){.okband,.okband.on,.okband .okic,.okband .okic svg path{animation:none!important;transition:opacity .18s ease}.okband .okic svg path{stroke-dashoffset:0}}
/* FAB */
.fab{position:fixed;bottom:calc(86px + env(safe-area-inset-bottom));left:50%;transform:translateX(calc(-50% - 180px));
  width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--gold1),var(--gold2));border:0;color:#231a02;
  font-size:30px;font-weight:900;cursor:pointer;z-index:40;box-shadow:0 8px 22px rgba(224,166,21,.45);display:flex;align-items:center;justify-content:center}
@media(max-width:470px){.fab{left:auto;right:18px;transform:none}}
/* modal / sheet */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:none;align-items:flex-end;justify-content:center}
.mask.on{display:flex}
.sheet{width:100%;max-width:480px;background:var(--panel);border-radius:18px 18px 0 0;border:1px solid var(--border);border-bottom:0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;animation:up .22s ease}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:translateY(0);opacity:1}}
.sheet h3{font-size:16px;font-weight:900;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between}
.sheet h3 .x{cursor:pointer;color:var(--muted);font-size:22px;line-height:1}
.ta{width:100%;min-height:120px;background:var(--panel2);border:1px solid var(--border);border-radius:12px;padding:12px;color:var(--txt);font-family:inherit;font-size:14px;line-height:1.7;outline:none;resize:vertical}
.ta::placeholder{color:#5c6675}
.tagrow{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.tg{padding:6px 12px;border-radius:999px;background:var(--panel2);border:1px solid var(--border);color:var(--gold2);font-size:12.5px;font-weight:800;cursor:pointer}
.btn{width:100%;padding:13px;border-radius:12px;border:0;background:linear-gradient(135deg,var(--gold1),var(--gold2));color:#231a02;font-size:15px;font-weight:900;cursor:pointer;font-family:inherit}
.btn:disabled{opacity:.5}
.attachrow{display:flex;gap:10px;align-items:center;margin:12px 0}
.attachbtn{display:inline-flex;align-items:center;gap:7px;padding:9px 14px;border-radius:12px;background:var(--panel2);border:1px solid var(--border);color:var(--txt);font-size:13px;font-weight:800;cursor:pointer;font-family:inherit}
.attachbtn svg{width:18px;height:18px;stroke:var(--gold2);fill:none;stroke-width:1.9}
.imgprev{position:relative;margin-bottom:12px}
.imgprev img{width:100%;border-radius:12px;display:block}
.imgprev .rm{position:absolute;top:8px;left:8px;width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;border:0;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.cmt{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
.cmt .av{width:34px;height:34px;font-size:14px}
.cmt .cb{flex:1}
.cmt .cb b{font-size:13px}
.cmt .cb p{font-size:13px;color:var(--txt);line-height:1.6;margin-top:2px}
.cmt .cb span{font-size:10.5px;color:var(--muted)}
.cmtbar{display:flex;gap:8px;margin-top:12px}
.cmtbar input{flex:1;background:var(--panel2);border:1px solid var(--border);border-radius:999px;padding:0 14px;height:40px;color:var(--txt);font-family:inherit;font-size:13px;outline:none}
.cmtbar button{flex:0 0 auto;padding:0 16px;border-radius:999px;border:0;background:var(--gold2);color:#231a02;font-weight:900;cursor:pointer;font-family:inherit}
.bnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;display:grid;grid-template-columns:repeat(5,1fr);background:#0f1216;border-top:1px solid var(--border);padding:8px 0 calc(8px + env(safe-area-inset-bottom));z-index:30}
html[data-theme=light] .bnav{background:#fff}
.bnav a{display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--muted);text-decoration:none;font-size:10px;font-weight:700}
.bnav a svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8}
.bnav a.active{color:var(--gold2)}
/* فيديو المنشور + البث المباشر */
.pvid{margin-top:10px;border-radius:12px;overflow:hidden;background:#0a0d11;border:1px solid var(--border)}
.pvid video{width:100%;display:block;border-radius:12px}
.pvidplay{width:100%;padding:28px 12px;background:linear-gradient(180deg,rgba(224,166,21,.12),transparent);border:0;color:var(--gold2);font-size:14px;font-weight:900;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:8px}
</style>

<div class="mask" id="cmtMask">
  <div class="sheet">

<script>
(function(){
  if(window.__tabSwipe)return;window.__tabSwipe=1;
  var ROWS=[{box:'#chips',item:'.chip',act:'active',min:40}];
  var st=document.createElement('style');
  st.textContent='.sw-pulse{animation:swPulse .3s cubic-bezier(.22,.61,.36,1)}@keyframes swPulse{0%{transform:scale(.9)}60%{transform:scale(1.06)}100%{transform:scale(1)}}@media (prefers-reduced-motion:reduce){.sw-pulse{animation:none}}';
  document.head.appendChild(st);
  function list(r){
    var box=document.querySelector(r.box);
    if(!box||box.offsetParent===null)return [];
    return Array.prototype.slice.call(box.querySelectorAll(r.item||'*'));
  }
  function current(r){var els=list(r);for(var i=0;i<els.length;i++){if(els[i].classList.contains(r.act))return i;}return 0;}
  function pickRow(dx){
    var a=Math.abs(dx),cand=[];
    for(var i=0;i<ROWS.length;i++){var r=ROWS[i];if(a>=r.min&&list(r).length>1)cand.push(r);}
    cand.sort(function(x,y){return y.min-x.min;});
    return cand[0]||null;
  }
  function inRow(el){
    for(var i=0;i<ROWS.length;i++){try{if(el.closest(ROWS[i].box))return true;}catch(e){}}
    return false;
  }
  function blocked(el){
    if(!el||el.nodeType!==1)return true;
    if(document.querySelector('.sheet.show,.drawer.show,.mdl.on,.mdl.show'))return true;
    if(el.closest('input,textarea,select,canvas,[data-noswipe],[contenteditable="true"]'))return true;
    if(inRow(el))return false;
    for(var n=el;n&&n!==document.body;n=n.parentElement){
      var cs=window.getComputedStyle(n);
      if((cs.overflowX==='auto'||cs.overflowX==='scroll')&&n.scrollWidth>n.clientWidth+6)return true;
    }
    return false;
  }
  function fire(el){
    try{el.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});}catch(e){}
    el.click();
    el.classList.remove('sw-pulse');void el.offsetWidth;el.classList.add('sw-pulse');
  }
  var sx=0,sy=0,active=false,locked=0;
  document.addEventListener('touchstart',function(e){
    if(e.touches.length!==1)return;
    if(blocked(e.target))return;
    var t=e.touches[0];sx=t.clientX;sy=t.clientY;active=true;locked=0;
  },{passive:true});
  document.addEventListener('touchmove',function(e){
    if(!active||!e.touches[0])return;
    var dx=e.touches[0].clientX-sx,dy=e.touches[0].clientY-sy;
    if(!locked){
      if(Math.abs(dx)>9&&Math.abs(dx)>Math.abs(dy)*1.15)locked=1;
      else if(Math.abs(dy)>9)locked=-1;

    if(locked===1&&e.cancelable)e.preventDefault();
  },{passive:false});
  document.addEventListener('touchend',function(e){
    if(!active)return;active=false;
    if(locked!==1)return;
    var t=e.changedTouches&&e.changedTouches[0];if(!t)return;
    var dx=t.clientX-sx,dy=t.clientY-sy;
    if(Math.abs(dy)>Math.abs(dx)*0.85)return;
    var r=pickRow(dx);if(!r)return;
    var els=list(r),i=current(r),j=i+(dx>0?1:-1);
    if(j<0||j>=els.length)return;
    fire(els[j]);
    try{if(navigator.vibrate)navigator.vibrate(6);}catch(err){}
  },{passive:true});
})();
</script>
