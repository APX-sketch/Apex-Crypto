<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>تسجيل الدخول — Apex</title>
<script src="i18n.js"></script>
<style>
:root{--bg:#0b0e11;--panel:#141920;--panel2:#1c232c;--border:#252d38;--txt:#eef2f6;--muted:#8a94a3;--gold1:#f8d979;--gold2:#e0a615;--green:#0ecb81;--red:#f6465d}
*{box-sizing:border-box}
body{margin:0;font-family:'Segoe UI',Tahoma,system-ui,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.wrap{width:100%;max-width:420px}
.logo{text-align:center;margin-bottom:22px}
.logo b{font-size:30px;font-weight:900;background:linear-gradient(135deg,var(--gold1),var(--gold2));-webkit-background-clip:text;background-clip:text;color:transparent}
.logo span{display:block;color:var(--muted);font-size:12px;margin-top:4px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:24px}
h1{font-size:20px;margin:0 0 4px}
.sub{color:var(--muted);font-size:13px;margin-bottom:18px}
.fld{margin-bottom:14px}
.fld label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:700}
.fld input{width:100%;padding:12px 14px;border-radius:12px;background:var(--panel2);border:1px solid var(--border);color:var(--txt);font-family:inherit;font-size:14px;outline:none}
.fld input:focus{border-color:var(--gold2)}
.btn{width:100%;padding:13px;border:0;border-radius:12px;font-family:inherit;font-weight:800;font-size:15px;cursor:pointer;background:linear-gradient(135deg,var(--gold1),var(--gold2));color:#231a02;margin-top:6px}
.btn:disabled{opacity:.6;cursor:default}
.alt{text-align:center;margin-top:16px;font-size:13px;color:var(--muted)}
.alt a{color:var(--gold2);font-weight:700;text-decoration:none}
.msg{padding:11px 14px;border-radius:10px;font-size:13px;margin-bottom:14px;display:none}
.msg.err{display:block;background:rgba(246,70,93,.12);color:#ff8a97;border:1px solid rgba(246,70,93,.3)}
.msg.warn{display:block;background:rgba(224,166,21,.12);color:var(--gold1);border:1px solid rgba(224,166,21,.3)}
.msg.ok{display:block;background:rgba(14,203,129,.12);color:#5be0a8;border:1px solid rgba(14,203,129,.3)}
.adminlink{text-align:center;margin-top:22px;font-size:12px}
.adminlink a{color:var(--muted);text-decoration:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo"><b>Apex</b><span>\\\\\\</span></div>
  <div class="card">
    <h1 data-i18n="loginTitle">تسجيل الدخول</h1>
    <div class="sub" data-i18n="loginSub">أدخل بيانات حسابك للمتابعة</div>
    <div class="msg" id="msg"></div>
    <div id="credBox">
      <div class="fld"><label data-i18n="email">البريد الإلكتروني</label><input id="email" type="email" autocomplete="email" placeholder="name@email.com" dir="ltr" style="text-align:right"></div>
      <div class="fld"><label data-i18n="password">كلمة المرور</label><input id="pass" type="password" autocomplete="current-password" placeholder="••••••••"></div>
      <div style="text-align:left;margin:-6px 0 2px"><a href="reset-password.html" style="color:var(--gold2);font-size:12.5px;font-weight:700;text-decoration:none">هل نسيت كلمة المرور؟</a></div>
      <button class="btn" id="submitBtn" onclick="doLogin()">دخول</button>
      <button class="btn" id="bioBtn" onclick="doBioLogin()" style="display:none;background:var(--panel2,#1a1f2b);color:var(--gold2,#f0b90b);border:1px solid var(--border,#2a3140);margin-top:10px">🔑 الدخول بالبصمة / الوجه</button>
      <div class="alt">ليس لديك حساب؟ <a href="register.html">إنشاء حساب</a></div>
    </div>
    <div id="otpBox" style="display:none">
      <div class="sub" id="otpHint" style="margin-bottom:14px">أدخل رمز التحقق المرسل إلى بريدك.</div>
      <div class="fld"><label>رمز التحقق</label><input id="otpCode" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="8" placeholder="000000" dir="ltr" style="text-align:center;letter-spacing:8px;font-size:20px;font-weight:800"></div>
      <button class="btn" id="otpBtn" onclick="doVerify()">تأكيد الدخول</button>
      <div class="alt"><a href="#" id="resendLink" onclick="doResend();return false;">إعادة إرسال الرمز</a> · <a href="#" onclick="otpBack();return false;">رجوع</a></div>
    </div>
  </div>
</div>
<script>
const $=id=>document.getElementById(id);
function getNext(){const p=new URLSearchParams(location.search);const n=p.get('next')||'index.html';return /^[a-zA-Z0-9_\-]+\.html$/.test(n)?n:'index.html';}
function showMsg(t,cls){const m=$('msg');m.textContent=t;m.className='msg '+(cls||'err');}
async function doLogin(){
  const email=$('email').value.trim(),pass=$('pass').value;
  if(!email||!pass)return showMsg('الرجاء إدخال البريد وكلمة المرور');
  const btn=$('submitBtn');btn.disabled=true;btn.textContent='جارٍ الدخول...';
  try{
    const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password:pass})});
    const d=await r.json();
    if(!r.ok){
      if(d.error==='pending')showMsg('حسابك قيد المراجعة من الإدارة. الرجاء الانتظار حتى الموافقة.','warn');
      else if(d.error==='rejected')showMsg('تم رفض طلبك'+(d.reason?(': '+d.reason):'.'),'err');
      else if(d.error==='banned')showMsg('تم حظر هذا الحساب. تواصل مع الدعم.','err');
      else showMsg('البريد أو كلمة المرور غير صحيحة','err');
      btn.disabled=false;btn.textContent='دخول';return;
    }
    // خطوة التحقق بخطوتين: الخادم يطلب رمز بريدي قبل إصدار التوكن
    if(d.otpRequired){
      OTP_EMAIL=d.email||email;
      $('credBox').style.display='none';
      $('otpBox').style.display='block';
      $('otpHint').textContent='أدخل رمز التحقق المرسل إلى '+(OTP_EMAIL||'بريدك')+'.';
      showMsg(d.devCode?('وضع التطوير: الرمز '+d.devCode):'تم إرسال رمز التحقق إلى بريدك.', d.devCode?'warn':'ok');
      btn.disabled=false;btn.textContent='دخول';
      setTimeout(function(){$('otpCode').focus();},80);
      return;
    }
    finishLogin(d);
  }catch(e){showMsg('خطأ في الاتصال بالخادم','err');btn.disabled=false;btn.textContent='دخول';}
}
function mapOtpErr(e){
  if(e==='bad_code'||e==='invalid')return 'رمز التحقق غير صحيح.';
  if(e==='expired'||e==='otp_expired')return 'انتهت صلاحية الرمز، اطلب رمزاً جديداً.';
  if(e==='too_many'||e==='locked')return 'محاولات كثيرة، اطلب رمزاً جديداً.';
  if(e==='banned')return 'تم حظر هذا الحساب. تواصل مع الدعم.';
  return 'تعذّر التحقق، حاول مجدداً.';
}
async function doVerify(){
  const code=($('otpCode').value||'').trim();
  if(!code)return showMsg('أدخل رمز التحقق');
  const btn=$('otpBtn');btn.disabled=true;btn.textContent='جارٍ التحقق...';
  try{
    const r=await fetch('/api/auth/login/verify-otp',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:OTP_EMAIL,code:code})});
    const d=await r.json();
    if(!r.ok){showMsg(mapOtpErr(d.error),'err');btn.disabled=false;btn.textContent='تأكيد الدخول';return;}
    finishLogin(d);
  }catch(e){showMsg('خطأ في الاتصال بالخادم','err');btn.disabled=false;btn.textContent='تأكيد الدخول';}
}
async function doResend(){
  if(!OTP_EMAIL)return;
  showMsg('جارٍ إعادة الإرسال...','ok');
  try{
    const r=await fetch('/api/auth/login/resend-otp',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:OTP_EMAIL})});
    const d=await r.json().catch(function(){return{};});
    showMsg(d.devCode?('وضع التطوير: الرمز '+d.devCode):'تم إرسال رمز جديد إلى بريدك.', d.devCode?'warn':'ok');
  }catch(e){showMsg('تعذّر إعادة الإرسال، حاول مجدداً.','err');}
}
function otpBack(){
  OTP_EMAIL='';
  $('otpBox').style.display='none';
  $('credBox').style.display='block';
  $('otpCode').value='';
  clearMsgSoft();
}
function clearMsgSoft(){const m=$('msg');m.textContent='';m.className='msg';}
function finishLogin(d){
  const sess = {
      id: d.user.id,
      uid: d.user.id,
      username: d.user.username,
      name: d.user.username,
      email: d.user.email,
      token: d.token
    };

    localStorage.setItem('skygo_session', JSON.stringify(sess));
    localStorage.setItem('apex_user', JSON.stringify(sess));
    localStorage.setItem('apex_token', d.token);
    localStorage.setItem('currentUser', JSON.stringify(sess));

    location.replace(getNext());
}
var OTP_EMAIL='';
$('pass').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
$('otpCode').addEventListener('keydown',e=>{if(e.key==='Enter')doVerify();});

/* ===== الدخول السريع بالبصمة/الوجه (WebAuthn) =====
   إن وجد رمز بيومتري محفوظ على هذا الجهاز نعرض زر الدخول السريع.
   التحقّق الحيوي (بصمة/وجه) يتم محلياً، ثم نرسل bioToken للخادم لإصدار الجلسة. */
function _bufFromB64u(str){str=String(str||'').replace(/-/g,'+').replace(/_/g,'/');while(str.length%4)str+='=';var bin=atob(str),b=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)b[i]=bin.charCodeAt(i);return b.buffer;}
function _randBuf(n){var b=new Uint8Array(n);(window.crypto||{}).getRandomValues&&window.crypto.getRandomValues(b);return b.buffer;}
(function(){
  try{
    if(localStorage.getItem('apex_bio')==='1'&&localStorage.getItem('apex_bio_token')&&window.PublicKeyCredential&&navigator.credentials&&navigator.credentials.get){
      $('bioBtn').style.display='block';
    }
  }catch(e){}
})();
async function doBioLogin(){
  const bioToken=localStorage.getItem('apex_bio_token')||'';
  const credId=localStorage.getItem('apex_bio_cred')||'';
  if(!bioToken){showMsg('لا توجد بصمة مسجّلة على هذا الجهاز','err');return;}
  const btn=$('bioBtn');btn.disabled=true;var old=btn.textContent;btn.textContent='جارٍ التحقّق...';
  try{
    // التحقّق الحيوي محلياً على الجهاز
    const opts={publicKey:{challenge:_randBuf(32),timeout:60000,userVerification:'required',rpId:location.hostname}};
    if(credId)opts.publicKey.allowCredentials=[{type:'public-key',id:_bufFromB64u(credId),transports:['internal']}];
    const assertion=await navigator.credentials.get(opts);
    if(!assertion){showMsg('تم إلغاء التحقّق','err');btn.disabled=false;btn.textContent=old;return;}
    // نجاح التحقّق → أصدر الجلسة من الخادم
    const r=await fetch('/api/auth/biometric/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({bioToken})});
    const d=await r.json().catch(()=>({}));
    if(!r.ok){
      if(d.error==='banned')showMsg('تم حظر هذا الحساب. تواصل مع الدعم.','err');
      else{showMsg('انتهت صلاحية البصمة، سجّل بالبريد وكلمة المرور.','err');
        try{localStorage.removeItem('apex_bio_token');}catch(e){}
        btn.style.display='none';}
      btn.disabled=false;btn.textContent=old;return;
    }
    finishLogin(d);
  }catch(e){
    if(e&&(e.name==='NotAllowedError'||e.name==='AbortError'))showMsg('تم إلغاء التحقّق','err');
    else showMsg('تعذّر الدخول بالبصمة، حاول مجدداً.','err');
    btn.disabled=false;btn.textContent=old;
  }
}
/* رسالة الجلسة الواحدة: إن تمّ فصل الجهاز لأنّ الحساب فُتح على جهاز آخر */
(function(){
  try{
    var p=new URLSearchParams(location.search);
    var reason=p.get('reason')||localStorage.getItem('apex_logout_reason')||'';
    try{localStorage.removeItem('apex_logout_reason');}catch(e){}
    if(reason==='device'){
      showMsg('تمّ تسجيل الدخول على جهاز آخر، فتمّ فصل هذا الجهاز. سجّل الدخول مجدداً للمتابعة.','warn');
    }
  }catch(e){}
})();
</script>
</body>
</html>
