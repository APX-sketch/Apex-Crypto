<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>تسجيل الدخول — Apex</title>
<script src="i18n.js"></script>
<style>
:root{--bg:#0b0e11;--panel:#141920;--panel2:#1c232c;--border:#252d38;--txt:#eef2f6;--muted:#8a94a3;--gold1:#f8d979;--gold2:#e0a615;--green:#0ecb81;--red:#f6465d}
*{box-sizing:border-box}
body{margin:0;font-family:'Segoe UI',Tahoma,system-ui,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.wrap{width:100%;max-width:420px}
.logo{text-align:center;margin-bottom:22px}
.logo b{font-size:30px;font-weight:900;background:linear-gradient(135deg,var(--gold1),var(--gold2));-webkit-background-clip:text;background-clip:text;color:transparent}
.logo span{display:block;color:var(--muted);font-size:12px;margin-top:4px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:24px}
h1{font-size:20px;margin:0 0 4px}
.sub{color:var(--muted);font-size:13px;margin-bottom:18px}
.fld{margin-bottom:14px}
.fld label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:700}
.fld input{width:100%;padding:12px 14px;border-radius:12px;background:var(--panel2);border:1px solid var(--border);color:var(--txt);font-family:inherit;font-size:14px;outline:none}
.fld input:focus{border-color:var(--gold2)}
.btn{width:100%;padding:13px;border:0;border-radius:12px;font-family:inherit;font-weight:800;font-size:15px;cursor:pointer;background:linear-gradient(135deg,var(--gold1),var(--gold2));color:#231a02;margin-top:6px}
.btn:disabled{opacity:.6;cursor:default}
.alt{text-align:center;margin-top:16px;font-size:13px;color:var(--muted)}
.alt a{color:var(--gold2);font-weight:700;text-decoration:none}
.msg{padding:11px 14px;border-radius:10px;font-size:13px;margin-bottom:14px;display:none}
.msg.err{display:block;background:rgba(246,70,93,.12);color:#ff8a97;border:1px solid rgba(246,70,93,.3)}
.msg.warn{display:block;background:rgba(224,166,21,.12);color:var(--gold1);border:1px solid rgba(224,166,21,.3)}
.msg.ok{display:block;background:rgba(14,203,129,.12);color:#5be0a8;border:1px solid rgba(14,203,129,.3)}
.adminlink{text-align:center;margin-top:22px;font-size:12px}
.adminlink a{color:var(--muted);text-decoration:none}
.otp-in{width:100%;text-align:center;letter-spacing:12px;font-size:26px;font-weight:900;padding:14px 0;border-radius:12px;border:1px solid var(--border);background:var(--panel2);color:var(--txt);direction:ltr;outline:none}
.otp-in:focus{border-color:var(--gold2)}
.otp-row{display:flex;justify-content:space-between;align-items:center;margin:12px 2px 0;font-size:13px}
.linkbtn{background:none;border:0;color:var(--gold2);font-family:inherit;font-weight:700;cursor:pointer;font-size:13px;padding:0}
.timer{color:var(--muted);font-size:12px}
.devcode{display:none;margin:0 0 14px;font-size:13px;color:#8fd;text-align:center;background:rgba(14,203,129,.10);border-radius:10px;padding:8px}
.backbtn{width:100%;margin-top:10px;background:none;border:0;color:var(--muted);font-family:inherit;font-size:14px;cursor:pointer}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo"><b>Apex</b><span>Crypto</span></div>

  <!-- الخطوة 1: بيانات الدخول -->
  <div class="card" id="stepLogin">
    <h1 data-i18n="loginTitle">تسجيل الدخول</h1>
    <div class="sub" data-i18n="loginSub">أدخل بيانات حسابك للمتابعة</div>
    <div class="msg" id="msg"></div>
    <div class="fld"><label data-i18n="email">البريد الإلكتروني</label><input id="email" type="email" autocomplete="email" placeholder="name@email.com" dir="ltr" style="text-align:right"></div>
    <div class="fld"><label data-i18n="password">كلمة المرور</label><input id="pass" type="password" autocomplete="current-password" placeholder="••••••••"></div>
    <button class="btn" id="submitBtn" onclick="doLogin()">دخول</button>
    <div class="alt">ليس لديك حساب؟ <a href="register.html">إنشاء حساب</a></div>
  </div>

  <!-- الخطوة 2: رمز التحقق -->
  <div class="card" id="stepOtp" style="display:none">
    <h1>تأكيد الدخول</h1>
    <div class="sub">أرسلنا رمزاً مكوّناً من 6 أرقام إلى بريدك</div>
    <div class="msg" id="msg2"></div>
    <div style="direction:ltr;text-align:center;color:var(--gold2);font-size:13px;margin-bottom:14px" id="otpEmail"></div>
    <div class="devcode" id="otpDev"></div>
    <div class="fld"><input id="otpCode" class="otp-in" type="text" inputmode="numeric" maxlength="6" placeholder="______" autocomplete="one-time-code"></div>
    <label style="display:flex;align-items:center;gap:9px;font-size:13px;color:var(--muted);margin:2px 2px 4px;cursor:pointer;user-select:none">
      <input id="rememberDev" type="checkbox" checked style="width:17px;height:17px;accent-color:var(--gold2);cursor:pointer">
      تذكّر هذا الجهاز (لا يُطلَب الرمز لمدة 30 يوماً)
    </label>
    <div class="otp-row">
      <button class="linkbtn" id="resendBtn" onclick="resendOtp()">إعادة الإرسال</button>
      <span class="timer" id="otpTimer"></span>
    </div>
    <button class="btn" id="verifyBtn" onclick="verifyOtp()">تأكيد ودخول</button>
    <button class="backbtn" onclick="backToLogin()">← رجوع</button>
  </div>
</div>
<script>
const $=id=>document.getElementById(id);
// معرّف ثابت للجهاز (يُنشأ مرة واحدة ويُحفظ) — يُستخدم لميزة تذكّر الجهاز.
function deviceId(){
  var k='apex_device_id';var v=localStorage.getItem(k);
  if(!v||!/^[A-Za-z0-9_-]{8,64}$/.test(v)){
    try{var a=new Uint8Array(16);crypto.getRandomValues(a);v=Array.from(a).map(function(x){return x.toString(16).padStart(2,'0');}).join('');}
    catch(e){v='d'+Date.now().toString(36)+Math.random().toString(36).slice(2,12);}
    localStorage.setItem(k,v);
  }
  return v;
}
// تخزين/جلب رمز ثقة الجهاز لكل بريد (حتى يعمل مع عدة حسابات على نفس الجهاز).
function trustKey(email){return 'apex_trust_'+String(email||'').trim().toLowerCase();}
function getTrust(email){try{return localStorage.getItem(trustKey(email))||'';}catch(e){return '';}}
function setTrust(email,tok){try{if(tok)localStorage.setItem(trustKey(email),tok);}catch(e){}}
function getNext(){const p=new URLSearchParams(location.search);const n=p.get('next')||'index.html';return /^[a-zA-Z0-9_\-]+\.html$/.test(n)?n:'index.html';}
function showMsg(t,cls){const m=$('msg');m.textContent=t;m.className='msg '+(cls||'err');}
function showMsg2(t,cls){const m=$('msg2');m.textContent=t;m.className='msg '+(cls||'err');}

var _loginEmail='', _otpTimer=null;

function saveSessionAndGo(d){
  const sess={id:d.user.id,uid:d.user.id,username:d.user.username,name:d.user.username,email:d.user.email,token:d.token};
  localStorage.setItem('skygo_session',JSON.stringify(sess));
  localStorage.setItem('apex_user',JSON.stringify(sess));
  localStorage.setItem('apex_token',d.token);
  localStorage.setItem('currentUser',JSON.stringify(sess));
  location.replace(getNext());
}

async function doLogin(){
  const email=$('email').value.trim(),pass=$('pass').value;
  if(!email||!pass)return showMsg('الرجاء إدخال البريد وكلمة المرور');
  const btn=$('submitBtn');btn.disabled=true;btn.textContent='جارٍ الدخول...';
  try{
    const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password:pass,deviceId:deviceId(),trustToken:getTrust(email)})});
    const d=await r.json();
    if(!r.ok){
      if(d.error==='pending')showMsg('حسابك قيد المراجعة من الإدارة. الرجاء الانتظار حتى الموافقة.','warn');
      else if(d.error==='rejected')showMsg('تم رفض طلبك'+(d.reason?(': '+d.reason):'.'),'err');
      else if(d.error==='banned')showMsg('تم حظر هذا الحساب. تواصل مع الدعم.','err');
      else showMsg('البريد أو كلمة المرور غير صحيحة','err');
      btn.disabled=false;btn.textContent='دخول';return;
    }
    // مطلوب تأكيد OTP → انتقل للخطوة الثانية
    if(d.otpRequired){
      _loginEmail=email;
      goToOtp(d);
      btn.disabled=false;btn.textContent='دخول';
      return;
    }
    // دخول مباشر (OTP معطّل)
    if(d.token){saveSessionAndGo(d);return;}
    showMsg('تعذّر الدخول','err');btn.disabled=false;btn.textContent='دخول';
  }catch(e){showMsg('خطأ في الاتصال بالخادم','err');btn.disabled=false;btn.textContent='دخول';}
}

function goToOtp(d){
  $('stepLogin').style.display='none';
  $('stepOtp').style.display='block';
  $('otpEmail').textContent=d.email||_loginEmail;
  showMsg2('','');
  $('otpCode').value='';
  if(d.devCode){$('otpDev').style.display='block';$('otpDev').textContent='رمز الاختبار: '+d.devCode;}else{$('otpDev').style.display='none';}
  startTimer(d.expiresInSec||300);
  setTimeout(function(){try{$('otpCode').focus();}catch(e){}},150);
}

function backToLogin(){
  if(_otpTimer){clearInterval(_otpTimer);_otpTimer=null;}
  $('stepOtp').style.display='none';
  $('stepLogin').style.display='block';
}

function startTimer(sec){
  if(_otpTimer)clearInterval(_otpTimer);
  var left=sec;var rb=$('resendBtn');rb.style.opacity='.5';rb.style.pointerEvents='none';
  function tick(){
    var m=Math.floor(left/60),s=left%60;
    $('otpTimer').textContent='صالح '+m+':'+(s<10?'0':'')+s;
    if(left<=0){clearInterval(_otpTimer);_otpTimer=null;$('otpTimer').textContent='انتهى الرمز';rb.style.opacity='1';rb.style.pointerEvents='auto';}
    left--;
  }
  tick();_otpTimer=setInterval(tick,1000);
}

async function verifyOtp(){
  const code=($('otpCode').value||'').replace(/\D/g,'');
  if(code.length!==6)return showMsg2('أدخل الرمز المكوّن من 6 أرقام');
  const btn=$('verifyBtn');btn.disabled=true;btn.textContent='جارٍ التحقق...';
  try{
    const r=await fetch('/api/auth/login/verify-otp',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:_loginEmail,code,rememberDevice:$('rememberDev')?$('rememberDev').checked:false,deviceId:deviceId()})});
    const d=await r.json();
    if(!r.ok){
      var map={otp_required:'اطلب رمزاً أولاً',otp_expired:'انتهى الرمز — أعد الإرسال',otp_invalid:'الرمز غير صحيح',otp_locked:'محاولات كثيرة — أعد الإرسال',banned:'تم حظر هذا الحساب'};
      showMsg2(map[d.error]||'تعذّر التحقق','err');
      btn.disabled=false;btn.textContent='تأكيد ودخول';
      if(d.error==='otp_invalid'){$('otpCode').value='';$('otpCode').focus();}
      return;
    }
    // خزّن رمز ثقة الجهاز إن أصدره الخادم (عند اختيار تذكّر الجهاز)
    if(d.trustToken)setTrust(_loginEmail,d.trustToken);
    if(d.token){saveSessionAndGo(d);return;}
    showMsg2('تعذّر الدخول','err');btn.disabled=false;btn.textContent='تأكيد ودخول';
  }catch(e){showMsg2('خطأ في الاتصال بالخادم','err');btn.disabled=false;btn.textContent='تأكيد ودخول';}
}

async function resendOtp(){
  showMsg2('','');
  try{
    const r=await fetch('/api/auth/login/resend-otp',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:_loginEmail})});
    const d=await r.json();
    if(d.devCode){$('otpDev').style.display='block';$('otpDev').textContent='رمز الاختبار: '+d.devCode;}
    startTimer(d.expiresInSec||300);
    showMsg2('أُعيد إرسال الرمز','ok');
  }catch(e){showMsg2('تعذّر إعادة الإرسال','err');}
}

$('pass').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
$('otpCode').addEventListener('input',function(){this.value=this.value.replace(/\D/g,'').slice(0,6);});
$('otpCode').addEventListener('keydown',e=>{if(e.key==='Enter')verifyOtp();});
</script>
</body>
</html>
