<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نجاح الإيداع - Apex Crypto</title>
    <style>
        body {
            background-color: #0b0e11;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .success-card {
            background: #181a20;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            text-align: center;
            max-width: 400px;
            width: 90%;
            border: 1px solid #2b313a;
        }
        .icon-container {
            width: 80px;
            height: 80px;
            background: rgba(14, 203, 129, 0.1);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 20px auto;
        }
        .success-icon {
            color: #0ecb81;
            font-size: 40px;
        }
        h1 {
            color: #0ecb81;
            font-size: 24px;
            margin-bottom: 10px;
        }
        p {
            color: #848e9c;
            font-size: 14px;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        .btn {
            display: inline-block;
            background: #fcd535;
            color: #181a20;
            padding: 12px 30px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
        }
        .btn:hover {
            background: #e6c128;
        }
    </style>
</head>
<body>

    <div class="success-card">
        <div class="icon-container">
            <span class="success-icon">✓</span>
        </div>
        <h1>تم إيداع المبلغ بنجاح</h1>
        <p>تهانينا! تمت معالجة عملية الدفع وتحديث رصيد محفظتك الرقمية بنجاح في النظام.</p>
        <a href="deposit.html" class="btn">العودة إلى المحفظة</a>
    </div>

</body>
</html>
