<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0e121a">
<title>Apex Wallet - Trust Style</title>
<style>
  :root {
    --bg-main: #0e121b;
    --card-bg: #19202e;
    --card-active: #232c3f;
    --border-color: #263044;
    --txt-main: #ffffff;
    --txt-muted: #8491a5;
    --accent-blue: #0052ff;
    --gold: #f3ba2f;
    --green: #00c087;
    --red: #f6465d;
    --radius-lg: 20px;
    --radius-md: 14px;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; height: 100%; background: #05070a; font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: var(--txt-main); display: flex; justify-content: center; }

  .app {
    width: 100%;
    max-width: 440px;
    background: var(--bg-main);
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    position: relative;
    overflow: hidden;
    box-shadow: 0 0 50px rgba(0,0,0,0.8);
  }

  svg { display: block; }
  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }

  /* ===== Header ===== */
  .hdr {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px;
    flex: 0 0 auto;
  }
  .hdr-btn {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: var(--card-bg);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
  }
  .hdr-btn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  
  .wallet-pill {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--card-bg);
    padding: 8px 16px;
    border-radius: 999px;
    font-size: 14px;
    font-weight: 700;
  }
  .wallet-pill .ico-main {
    width: 20px;
    height: 20px;
    background: var(--accent-blue);
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 900;
  }

  /* ===== Main Content Area ===== */
  .body { flex: 1 1 auto; overflow-y: auto; padding: 0 16px 20px; }
  .body::-webkit-scrollbar { width: 0; }

  /* Banner Card */
  .backup-banner {
    background: var(--card-bg);
    border-radius: var(--radius-lg);
    padding: 14px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
  }
  .banner-right { display: flex; align-items: center; gap: 12px; }
  .clock-icon {
    width: 36px;
    height: 36px;
    border-radius: 12px;
    background: rgba(243, 186, 47, 0.15);
    color: var(--gold);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .clock-icon svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; }
  .banner-text .title { font-size: 14px; font-weight: 700; }
  .banner-text .sub { font-size: 12px; color: var(--txt-muted); margin-top: 2px; }
  .close-btn { color: var(--txt-muted); padding: 4px; }

  /* Section Titles */
  .section-title {
    font-size: 20px;
    font-weight: 800;
    margin: 20px 0 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .section-title .more-link {
    font-size: 14px;
    color: var(--txt-muted);
    display: flex;
    align-items: center;
    gap: 4px;
    font-weight: 600;
  }

  /* Quick Actions (3 Cards) */
  .quick-actions {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 24px;
  }
  .act-card {
    background: var(--card-bg);
    border-radius: var(--radius-lg);
    padding: 18px 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    text-align: center;
    transition: background .15s;
  }
  .act-card:active { background: var(--card-active); }
  .act-card .icon-wrap {
    width: 28px;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .act-card .icon-wrap svg { width: 26px; height: 26px; }
  .act-card span { font-size: 13px; font-weight: 700; line-height: 1.3; }

  /* Single Featured Token Row */
  .token-item {
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 0;
  }
  .token-left { display: flex; align-items: center; gap: 12px; }
  .token-icon {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: #f0b90b;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 900;
    color: #000;
  }
  .token-details .name { font-size: 15px; font-weight: 800; }
  .token-details .amount { font-size: 13px; color: var(--txt-muted); margin-top: 2px; }
  .token-right { text-align: left; direction: ltr; }
  .token-right .val { font-size: 15px; font-weight: 800; }
  .token-right .subval { font-size: 13px; color: var(--txt-muted); margin-top: 2px; }

  /* Perpetual Contracts Horizontal Scroll */
  .perp-scroll {
    display: flex;
    gap: 12px;
    overflow-x: auto;
    padding-bottom: 10px;
    margin-right: -16px;
    padding-right: 16px;
  }
  .perp-scroll::-webkit-scrollbar { display: none; }
  
  .perp-card {
    min-width: 160px;
    background: var(--card-bg);
    border-radius: var(--radius-lg);
    padding: 16px;
    flex: 0 0 auto;
    position: relative;
  }
  .perp-top { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .perp-icon { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 800; }
  .perp-icon.btc { background: #f7931a; color: #fff; }
  .perp-icon.eth { background: #627eea; color: #fff; }
  
  .perp-pair { font-size: 15px; font-weight: 800; display: flex; align-items: center; gap: 6px; }
  .perp-lev { font-size: 11px; background: rgba(255,255,255,0.1); padding: 2px 6px; border-radius: 6px; color: var(--txt-muted); }
  .perp-vol { font-size: 13px; color: var(--txt-muted); direction: ltr; text-align: right; margin-top: 4px; }

  /* Bottom Navigation Bar */
  .nav {
    flex: 0 0 auto;
    display: flex;
    justify-content: space-around;
    padding: 10px 0 calc(10px + env(safe-area-inset-bottom));
    background: #090c12;
    border-top: 1px solid rgba(255,255,255,0.05);
  }
  .nav-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    color: var(--txt-muted);
    font-size: 11px;
    font-weight: 600;
  }
  .nav-btn.active { color: #ffffff; }
  .nav-btn svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  /* Modal Sheets */
  .ov { position: fixed; inset: 0; background: rgba(0,0,0,0.75); display: none; align-items: flex-end; justify-content: center; z-index: 100; }
  .ov.on { display: flex; }
  .sheet { width: 100%; max-width: 440px; background: var(--card-bg); border-radius: 24px 24px 0 0; padding: 20px 18px calc(20px + env(safe-area-inset-bottom)); }
  .sheet-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .sheet-header h3 { margin: 0; font-size: 18px; }
  .btn-primary { width: 100%; background: var(--accent-blue); color: #fff; font-weight: 700; padding: 14px; border-radius: 12px; margin-top: 10px; }
</style>
</head>
<body>

<div class="app">

  <!-- ===== Header ===== -->
  <div class="hdr">
    <div class="wallet-pill" onclick="openSheet('account')">
      <div class="ico-main">W</div>
      <span id="acctName">المحفظة الرئيسي...</span>
    </div>

    <div style="display:flex; gap:10px;">
      <button class="hdr-btn" onclick="openSheet('history')" title="السجل">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
      </button>
      <button class="hdr-btn" onclick="openSheet('qr')" title="مسح QR">
        <svg viewBox="0 0 24 24"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/></svg>
      </button>
    </div>
  </div>

  <!-- ===== Scrollable Body ===== -->
  <div class="body">

    <!-- Backup Banner -->
    <div class="backup-banner" id="backupBanner">
      <div class="banner-right">
        <div class="clock-icon">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
        </div>
        <div class="banner-text">
          <div class="title">انسخ محفظتك احتياطياً</div>
          <div class="sub">احمِ أصولك من خلال النسخ الاحتياطي لبارة الاسترداد</div>
        </div>
      </div>
      <button class="close-btn" onclick="document.getElementById('backupBanner').style.display='none'">✕</button>
    </div>

    <!-- Title: Start Adding Crypto -->
    <div class="section-title">
      <span>ابدأ بإضافة بعض العملات الرقمية</span>
    </div>

    <!-- Quick Action Cards (Buy, Deposit, Receive) -->
    <div class="quick-actions">
      <div class="act-card" onclick="openSheet('buy')">
        <div class="icon-wrap">
          <svg viewBox="0 0 36 24" fill="none">
            <rect width="36" height="24" rx="4" fill="#1E293B"/>
            <circle cx="14" cy="12" r="6" fill="#EB001B"/>
            <circle cx="22" cy="12" r="6" fill="#F79E1B" fill-opacity="0.8"/>
          </svg>
        </div>
        <span>اشترِ باستخدام البطاقات</span>
      </div>

      <div class="act-card" onclick="openSheet('fund')">
        <div class="icon-wrap">
          <svg viewBox="0 0 24 24" fill="#F0B90B"><path d="M12 3l4 4-4 4-4-4 4-4zm0 14l4 4-4 4-4-4 4-4zm-7-7l4 4-4 4-4-4 4-4zm14 0l4 4-4 4-4-4 4-4z"/></svg>
        </div>
        <span>أودِع من بينانس</span>
      </div>

      <div class="act-card" onclick="openSheet('receive')">
        <div class="icon-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="#5B8DEF" stroke-width="2"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><path d="M14 14h6v6h-6z"/></svg>
        </div>
        <span>استلم العملات الرقمية</span>
      </div>
    </div>

    <!-- Featured Tokens Section -->
    <div class="section-title">
      <span>الرموز المميزة</span>
      <a href="#" class="more-link" onclick="openSheet('search');return false;">عرض الكل ❮</a>
    </div>

    <div id="assetsBox">
      <!-- Default BNB Row matching screenshot -->
      <div class="token-item">
        <div class="token-left">
          <div class="token-icon">⚡</div>
          <div class="token-details">
            <div class="name">BNB</div>
            <div class="amount" id="bnbBalance">0 BNB</div>
          </div>
        </div>
        <div class="token-right">
          <div class="val" id="bnbUsd">$0.00</div>
          <div class="subval">$0.00</div>
        </div>
      </div>
    </div>

    <!-- Perpetual Contracts Section -->
    <div class="section-title" style="margin-top: 28px;">
      <span>العقود الدائمة</span>
      <a href="#" class="more-link" onclick="location.href='futures.html';return false;">❮</a>
    </div>

    <div class="perp-scroll">
      <!-- BTC Card -->
      <div class="perp-card" onclick="location.href='trading.html?pair=BTCUSDT'">
        <div class="perp-top">
          <div class="perp-icon btc">₿</div>
          <div>
            <div class="perp-pair">BTC <span class="perp-lev">40x</span></div>
          </div>
        </div>
        <div class="perp-vol" id="btcVol">$4.94B Vol</div>
      </div>

      <!-- ETH Card -->
      <div class="perp-card" onclick="location.href='trading.html?pair=ETHUSDT'">
        <div class="perp-top">
          <div class="perp-icon eth">Ξ</div>
          <div>
            <div class="perp-pair">ETH <span class="perp-lev">25x</span></div>
          </div>
        </div>
        <div class="perp-vol" id="ethVol">$1.53B Vol</div>
      </div>
    </div>

  </div>

  <!-- ===== Bottom Navigation ===== -->
  <div class="nav">
    <button class="nav-btn active">
      <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      <span>الرئيسية</span>
    </button>
    <button class="nav-btn" onclick="location.href='trading.html'">
      <svg viewBox="0 0 24 24"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
      <span>تداول</span>
    </button>
    <button class="nav-btn" onclick="openSheet('swap')">
      <svg viewBox="0 0 24 24"><path d="M7 16V4M7 4L3 8M7 4l4 4M17 8v12M17 20l4-4M17 20l-4-4"/></svg>
      <span>مبادلة</span>
    </button>
    <button class="nav-btn" onclick="openSheet('search')">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
      <span>بحث</span>
    </button>
  </div>

</div>

<!-- Overlays / Sheets -->
<div class="ov" id="ov">
  <div class="sheet" id="sheetContent"></div>
</div>

<script>
  // Functions to maintain backend integration
  function openSheet(type) {
    const ov = document.getElementById('ov');
    const sc = document.getElementById('sheetContent');
    ov.classList.add('on');
    
    if(type === 'receive' || type === 'fund') {
      sc.innerHTML = `
        <div class="sheet-header">
          <h3>إيداع واستلام</h3>
          <button onclick="closeSheet()">✕</button>
        </div>
        <p style="color:var(--txt-muted); font-size:14px;">عنوان المحفظة الخاص بك للإيداع:</p>
        <input type="text" value="0x71C...9A2" readonly style="width:100%; padding:12px; background:#10141d; border:1px solid #263044; color:#fff; border-radius:10px; margin-bottom:12px;">
        <button class="btn-primary" onclick="alert('تم النسخ!')">نسخ العنوان</button>
      `;
    } else {
      sc.innerHTML = `
        <div class="sheet-header">
          <h3>الخدمة</h3>
          <button onclick="closeSheet()">✕</button>
        </div>
        <p style="color:var(--txt-muted);">جاري تحميل البيانات...</p>
        <button class="btn-primary" onclick="closeSheet()">إغلاق</button>
      `;
    }
  }

  function closeSheet() {
    document.getElementById('ov').classList.remove('on');
  }

  document.getElementById('ov').addEventListener('click', function(e) {
    if(e.target === this) closeSheet();
  });
</script>

</body>
</html>
