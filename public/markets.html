<style>
/* ===== التبويبات العلوية (الفئات) ===== */

.mrow .nm b{font-size:14px;font-weight:800;display:block;white-space:nowrap}
.mrow .nm b .tag{font-size:10px;color:var(--muted);font-weight:700;margin-right:3px}
.mrow .nm span{font-size:11px;color:var(--muted);direction:ltr;display:block}

<script>
const API_BASE='';
const $=id=>document.getElementById(id);
const fmt=(n,d=2)=>Number(n).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
function fmtPx(p){p=+p;if(!isFinite(p)||p<=0)return null;if(p>=1)return p.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});if(p>=0.1)return p.toFixed(4);if(p>=0.001)return p.toFixed(6);return p.toFixed(10).replace(/0+$/,'');}
function fmtVol(v){v=+v;if(!isFinite(v)||v<=0)return '-';if(v>=1e9)return (v/1e9).toFixed(2)+'B';if(v>=1e6)return (v/1e6).toFixed(2)+'M';if(v>=1e3)return (v/1e3).toFixed(1)+'K';return v.toFixed(0);}
function icoUrl(b){return 'https://cdn.jsdelivr.net/gh/atomiclabs/cryptocurrency-icons@1a63530be6e374711a8554f31b17e4cb92c25fa5/128/color/'+b.toLowerCase()+'.png';}
const QUOTES=['USDT','USDC','FDUSD','BUSD','TUSD','BTC','ETH','BNB'];
const STABLE=['USDT','USDC','FDUSD','BUSD','TUSD'];
const MAJ=['BTC','ETH','BNB','SOL','XRP','DOGE','ADA','LTC','LINK','AVAX','DOT','TRX','BCH'];
function splitSym(sym){for(const q of QUOTES){if(sym.endsWith(q)&&sym.length>q.length)return{base:sym.slice(0,-q.length),quote:q};}return{base:sym,quote:''};}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
let ROWS=[];const pxPrev={};
const MSESS=JSON.parse(localStorage.getItem('skygo_session')||'{}');
function _uid(e){var h=0;e=(e||'').toLowerCase();for(var i=0;i<e.length;i++){h=(h*31+e.charCodeAt(i))>>>0;}return(100000000+(h%900000000));}
const FAVKEY='apex_favs_'+_uid(MSESS.email);
function loadFavs(){try{return JSON.parse(localStorage.getItem(FAVKEY)||'[]');}catch(e){return[];}}
let FAVS=loadFavs();
function saveFavs(){localStorage.setItem(FAVKEY,JSON.stringify(FAVS));}
const STAR='<svg viewBox="0 0 24 24"><path d="M12 3l2.9 6 6.1.9-4.5 4.4 1.1 6.3L12 18.6 6.4 20.6l1.1-6.3L3 9.9 9.1 9z"/></svg>';
function toggleFav(e,sym){e.stopPropagation();const i=FAVS.indexOf(sym);if(i>=0)FAVS.splice(i,1);else FAVS.push(sym);saveFavs();render();}
window.toggleFav=toggleFav;
/* تنبيهات الأسعار */
const ALKEY='apex_alerts_'+_uid(MSESS.email);
function loadAlerts(){try{return JSON.parse(localStorage.getItem(ALKEY)||'{}')||{};}catch(e){return{};}}
let ALERTS=loadAlerts();
function saveAlerts(){localStorage.setItem(ALKEY,JSON.stringify(ALERTS));}
function beep(){try{const a=new (window.AudioContext||window.webkitAudioContext)();const o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.type='sine';o.frequency.value=880;g.gain.setValueAtTime(.001,a.currentTime);g.gain.exponentialRampToValueAtTime(.25,a.currentTime+.02);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.5);o.start();o.stop(a.currentTime+.5);}catch(e){}}
function notify(t,b){if('Notification' in window&&Notification.permission==='granted'){try{new Notification(t,{body:b});}catch(e){}}beep();}
function checkAlerts(){Object.keys(ALERTS).forEach(sym=>{const al=ALERTS[sym];if(!al||al.triggered)return;const r=ROWS.find(x=>x.sym===sym);if(!r)return;const hit=al.dir==='up'?(r.price>=al.target):(r.price<=al.target);if(hit){al.triggered=true;al.hitPrice=r.price;saveAlerts();notify('🔔 تنبيه سعر '+r.base,r.base+'/'+r.quote+' وصل إلى '+fmt(r.price,2)+' '+r.quote);}});}
</script>
<script>
/* ===== الحالة: الفئة + التبويب الفرعي + الترتيب ===== */
let CAT='fav',SUB='spot',QSTR='';
let SORT={key:'vol',dir:'desc'};
/* يُرجع القائمة المفلترة حسب الفئة/التبويب */
function catList(){
  let out=ROWS.slice();
  if(CAT==='fav'){return out.filter(r=>FAVS.includes(r.sym));}
  if(CAT!=='crypto')return [];
  if(SUB==='spot'){out=out.filter(r=>STABLE.includes(r.quote));}
  else if(SUB==='usdm'){out=out.filter(r=>r.quote==='USDT'&&MAJ.includes(r.base));out.forEach(r=>r.mkt='USDⓈ-M');}
  else if(SUB==='coinm'){out=out.filter(r=>r.quote==='USDT'&&MAJ.includes(r.base));out.forEach(r=>r.mkt='COIN-M');}
  else if(SUB==='options'){return [];}
  return out;
}
function sortList(list){
  const k=SORT.key,s=SORT.dir==='desc'?-1:1;
  return list.sort((a,b)=>{
    if(k==='name')return s*a.base.localeCompare(b.base);
    if(k==='vol')return s*((a.vol||0)-(b.vol||0));
    if(k==='price')return s*((a.price||0)-(b.price||0));
    return s*((a.pct||0)-(b.pct||0));
  });
}
function emptyState(){
  if(CAT==='fav')return '<div class="empty"><div class="big">⭐</div><b>لا مفضلة بعد</b><p>اضغط النجمة بجانب أي عملة لإضافتها هنا والوصول السريع لها.</p></div>';
  if(CAT==='tradfi')return '<div class="empty"><div class="big">🏦</div><b>التمويل التقليدي</b><p>فوركس، أسهم، سلع ومؤشرات عالمية — تُطرح قريباً على منصّة Apex.</p></div>';
  if(CAT==='predict')return '<div class="empty"><div class="big">🔮</div><b>أسواق التوقّع</b><p>راهن على نتائج الأحداث والأسعار المستقبلية — قريباً.</p></div>';
  if(CAT==='crypto'&&SUB==='options')return '<div class="empty"><div class="big">🧩</div><b>عقود الخيارات</b><p>خيارات Call / Put على BTC وETH — قريباً على Apex.</p></div>';
  return '<div class="empty"><div class="big">🔍</div><b>لا نتائج</b><p>جرّب كلمة بحث أخرى.</p></div>';
}
function render(){
  const body=$('mktBody');if(!body)return;
  let list=catList();
  if(QSTR){const s=QSTR.toUpperCase();list=list.filter(r=>r.sym.includes(s)||r.base.includes(s));}
  list=sortList(list);
  if(!list.length){body.innerHTML=emptyState();return;}
  const routeFut=(CAT==='crypto'&&(SUB==='usdm'||SUB==='coinm'));
  body.innerHTML=list.map(r=>{
    const up=r.pct>=0;
    const prev=pxPrev[r.sym];let dir='eq';if(prev!=null){if(r.price>prev)dir='up';else if(r.price<prev)dir='dn';}pxPrev[r.sym]=r.price;
    const isApx=(window.APX&&r.base===APX.BASE);
    const logo=isApx?'<span class="apxlogo">A</span>':'<img src="'+icoUrl(r.base)+'" onerror="this.style.visibility=\'hidden\'">';
    const tag=r.mkt?'<span class="tag">'+r.mkt+'</span>':'';
    const sub='حجم '+fmtVol(r.vol)+' • '+esc(r.base)+'/'+esc(r.quote||'');
    const href=routeFut?('futures.html?symbol='+r.sym.toLowerCase()):('trading.html?symbol='+r.sym.toLowerCase());
    return '<div class="mrow" onclick="location.href=\''+href+'\'">'+
      '<span class="fav'+(FAVS.includes(r.sym)?' on':'')+'" onclick="toggleFav(event,\''+r.sym+'\')">'+STAR+'</span>'+
      logo+
      '<div class="nm"><b>'+esc(r.base)+tag+'</b><span>'+sub+'</span></div>'+
      '<span class="mpx px '+dir+'">$'+fmtPx(r.price)+'</span>'+
      '<span class="mpc pc '+(up?'up':'dn')+'">'+(up?'+':'')+r.pct.toFixed(2)+'%</span>'+
    '</div>';
  }).join('');
}
/* ===== جلب البيانات من سيرفرك (وكيل Binance + كاش) ===== */
async function poll(){
  try{
    const r=await fetch(API_BASE+'/api/markets',{headers:{'Accept':'application/json'}});
    if(!r.ok)throw new Error('HTTP '+r.status);
    const raw=await r.json();
    const arr=Array.isArray(raw)?raw:(Array.isArray(raw.data)?raw.data:Object.values(raw));
    ROWS=arr.map(d=>{
      const sym=d.symbol||d.s;if(!sym)return null;
      const last=d.lastPrice!=null?d.lastPrice:(d.c!=null?d.c:(d.price!=null?d.price:d.p));
      const pct=d.priceChangePercent!=null?d.priceChangePercent:(d.P!=null?d.P:(d.changePct24h!=null?d.changePct24h:0));
      const vol=d.quoteVolume!=null?d.quoteVolume:(d.q!=null?d.q:(d.volume!=null?d.volume:0));
      const{base,quote}=splitSym(sym);
      return{sym,base,quote,price:parseFloat(last),pct:parseFloat(pct)||0,vol:parseFloat(vol)||0};
    }).filter(Boolean).filter(r=>isFinite(r.price)&&r.price>0);
    if(window.APX&&APX.cfg().enabled){var _t=APX.ticker();var _row={sym:APX.SYM,base:APX.BASE,quote:'USDT',price:APX.live(),pct:parseFloat(_t.priceChangePercent)||0,vol:parseFloat(_t.quoteVolume)||0};var _i=ROWS.findIndex(function(x){return x.sym===APX.SYM;});if(_i>=0)ROWS[_i]=_row;else ROWS.unshift(_row);}
    checkAlerts();
    render();
  }catch(e){}
}
/* ===== الأحداث ===== */
$('cats').addEventListener('click',e=>{
  const b=e.target.closest('.cat');if(!b)return;
  document.querySelectorAll('.cat').forEach(c=>c.classList.remove('active'));
  b.classList.add('active');CAT=b.dataset.c;
  $('subs').style.display=(CAT==='crypto')?'flex':'none';
  $('sortbar').style.display=(CAT==='crypto'||CAT==='fav')?'flex':'none';
  render();
});
$('subs').addEventListener('click',e=>{
  const b=e.target.closest('.sub');if(!b)return;
  document.querySelectorAll('.sub').forEach(c=>c.classList.remove('active'));
  b.classList.add('active');SUB=b.dataset.s;render();
});
$('sortbar').addEventListener('click',e=>{
  const o=e.target.closest('.sortopt');if(!o)return;
  const k=o.dataset.k;
  if(SORT.key===k){SORT.dir=(SORT.dir==='desc')?'asc':'desc';}
  else{SORT.key=k;SORT.dir=(k==='name')?'asc':'desc';}
  document.querySelectorAll('.sortopt').forEach(x=>{x.classList.remove('on');x.querySelector('.ar').textContent='';});
  o.classList.add('on');o.querySelector('.ar').textContent=(SORT.dir==='desc')?'▼':'▲';
  render();
