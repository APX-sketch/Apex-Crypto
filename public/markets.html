<style>
:root{
  --bg:#0b0e11;--panel:#141920;--panel2:#1c232c;--border:#252d38;
  --txt:#eef2f6;--muted:#8a94a3;--gold1:#f8d979;--gold2:#e0a615;
  --green:#0ecb81;--red:#f6465d;
}
html[data-theme=light]{--bg:#f6f8fb;--panel:#ffffff;--panel2:#eef1f6;--border:#e2e7ef;--txt:#0d1421;--muted:#6b7686;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Segoe UI',Tahoma,system-ui,sans-serif;background:var(--bg);color:var(--txt);
  max-width:480px;margin:0 auto;padding-bottom:76px;min-height:100vh;position:relative;overflow-x:hidden}
.hdr{display:flex;align-items:center;gap:10px;padding:calc(12px + env(safe-area-inset-top)) 14px 10px;
  background:linear-gradient(135deg,#1b1f24,#0f1216);position:sticky;top:0;z-index:20;border-bottom:1px solid var(--border)}
html[data-theme=light] .hdr{background:linear-gradient(135deg,#ffffff,#eef1f6)}
.hdr .ttl{font-size:18px;font-weight:900}
.hsearch{flex:1;display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--border);
  border-radius:11px;padding:0 12px;height:38px}
.hsearch svg{width:16px;height:16px;stroke:var(--muted);fill:none;stroke-width:2}
.hsearch input{flex:1;background:none;border:0;color:var(--txt);font-family:inherit;font-size:13px;outline:none}
.hsearch input::placeholder{color:#5c6675}
.icobtn{width:38px;height:38px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
  background:var(--panel2);border:1px solid var(--border);border-radius:11px;cursor:pointer;color:var(--txt)}

<style>
/* ===== التبويبات العلوية (الفئات) ===== */
.cats{display:flex;gap:4px;padding:10px 12px 2px;overflow-x:auto;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{flex:0 0 auto;padding:7px 4px;background:none;border:0;color:var(--muted);font-size:15px;
  font-weight:800;cursor:pointer;position:relative;white-space:nowrap;font-family:inherit}
.cat.active{color:var(--txt)}
.cat.active::after{content:"";position:absolute;bottom:-3px;right:50%;transform:translateX(50%);
  width:60%;height:3px;border-radius:3px;background:linear-gradient(90deg,var(--gold1),var(--gold2))}
.cat+.cat{margin-right:14px}
/* ===== التبويبات الفرعية ===== */
.subs{display:flex;gap:8px;padding:12px;overflow-x:auto;scrollbar-width:none}
.subs::-webkit-scrollbar{display:none}
.sub{flex:0 0 auto;padding:7px 14px;border-radius:999px;background:var(--panel);border:1px solid var(--border);
  color:var(--muted);font-size:12.5px;font-weight:800;cursor:pointer;white-space:nowrap;transition:.15s;font-family:inherit}
.sub.active{background:linear-gradient(135deg,var(--gold1),var(--gold2));color:#231a02;border-color:transparent}
/* ===== شريط الترتيب ===== */
.sortbar{display:flex;align-items:center;padding:8px 16px;color:var(--muted);font-size:11.5px;
  font-weight:800;border-bottom:1px solid var(--border);background:var(--panel2);position:sticky;top:60px;z-index:10}
.sortbar .sg{display:flex;align-items:center;gap:12px}
.sortbar .sg.r{margin-right:auto;flex-direction:row-reverse;gap:14px}
.sortopt{display:inline-flex;align-items:center;gap:3px;cursor:pointer;user-select:none;transition:.12s}
.sortopt.on{color:var(--gold2)}
.sortopt .ar{font-size:9px;opacity:.9;line-height:1}
.sortopt.on .ar{color:var(--gold2)}
/* ===== القائمة ===== */
.mlist{padding:2px 0}
.mrow{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--border);cursor:pointer}
.mrow:active{background:var(--panel2)}
.mrow .fav{flex:0 0 auto;width:26px;height:26px;display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:8px}
.mrow .fav svg{width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:1.8;transition:.15s}
.mrow .fav.on svg{stroke:var(--gold2);fill:var(--gold2)}
.mrow img{width:30px;height:30px;border-radius:50%;flex:0 0 auto;background:var(--panel2)}
.mrow .apxlogo{width:30px;height:30px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:16px;color:#231a02;background:linear-gradient(135deg,var(--gold1),var(--gold2))}
.mrow .nm{flex:0 1 auto;min-width:0;max-width:44%}
.mrow .nm b{font-size:14px;font-weight:800;display:block;white-space:nowrap}
.mrow .nm b .tag{font-size:10px;color:var(--muted);font-weight:700;margin-right:3px}
.mrow .nm span{font-size:11px;color:var(--muted);direction:ltr;display:block}
.mrow .mpx{flex:1;text-align:center;direction:ltr;font-size:14px;font-weight:800;border-radius:6px;padding:1px 4px}
.mrow .mpc{flex:0 0 auto;min-width:76px;text-align:center;direction:ltr;font-size:12.5px;font-weight:800;padding:4px 8px;border-radius:8px}
.pc.up{color:#04180f;background:linear-gradient(90deg,#0ecb81,#0a9d64)}
.pc.dn{color:#fff;background:linear-gradient(90deg,#f6465d,#c62b40)}
@keyframes pxFlashUp{0%{background:rgba(14,203,129,.28)}100%{background:transparent}}
@keyframes pxFlashDn{0%{background:rgba(246,70,93,.28)}100%{background:transparent}}
.px.up{color:var(--green);animation:pxFlashUp .7s ease-out}
.px.dn{color:var(--red);animation:pxFlashDn .7s ease-out}
.px.eq{color:var(--txt)}
.empty{padding:54px 24px;text-align:center;color:var(--muted)}
.empty .big{font-size:40px;margin-bottom:10px}
.empty b{display:block;color:var(--txt);font-size:15px;margin-bottom:6px}
.empty p{font-size:12.5px;line-height:1.7}
/* ===== شريط التنقل السفلي ===== */
.bnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;
  display:grid;grid-template-columns:repeat(6,1fr);background:#0f1216;border-top:1px solid var(--border);
  padding:8px 0 calc(8px + env(safe-area-inset-bottom));z-index:30}
html[data-theme=light] .bnav{background:#ffffff}
.bnav a{display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--muted);text-decoration:none;font-size:10px;font-weight:700}
.bnav a svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8}
.bnav a.active{color:var(--gold2)}
.bnav a.sq svg{fill:none}
/* ===== التمويل التقليدي ===== */
.tf-grp{font-size:11px;font-weight:900;color:var(--muted);padding:12px 16px 4px;letter-spacing:.3px}
.tf-ico{width:30px;height:30px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:17px;background:var(--panel2)}
/* ===== أسواق التوقع ===== */
.pm-wrap{padding:12px}
.pm-card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:14px;margin-bottom:12px}
.pm-q{font-size:14px;font-weight:800;line-height:1.5;margin-bottom:12px}
.pm-meta{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:12px;font-weight:700}
.pm-bar{height:7px;border-radius:7px;background:var(--red);overflow:hidden;margin-bottom:12px}
.pm-bar i{display:block;height:100%;background:var(--green);border-radius:7px}
.pm-btns{display:flex;gap:10px}
.pm-btns button{flex:1;border:0;border-radius:12px;font-family:inherit;font-weight:900;font-size:13px;padding:12px 0;cursor:pointer}
.pm-yes{background:rgba(14,203,129,.15);color:var(--green);border:1px solid rgba(14,203,129,.4)!important}
.pm-no{background:rgba(246,70,93,.15);color:var(--red);border:1px solid rgba(246,70,93,.4)!important}
.pm-btns button:active{transform:scale(.97)}
/* ===== الخيارات ===== */
.opt-top{display:flex;gap:8px;padding:12px;flex-wrap:wrap}
.opt-seg{display:flex;gap:6px;background:var(--panel2);border-radius:10px;padding:4px}
.opt-seg button{border:0;background:none;color:var(--muted);font-family:inherit;font-weight:800;font-size:12px;padding:7px 14px;border-radius:8px;cursor:pointer}
.opt-seg button.on{background:linear-gradient(135deg,var(--gold1),var(--gold2));color:#231a02}
.opt-exp{display:flex;gap:7px;overflow-x:auto;padding:0 12px 6px;scrollbar-width:none}
.opt-exp::-webkit-scrollbar{display:none}
.opt-exp button{flex:0 0 auto;border:1px solid var(--border);background:var(--panel);color:var(--muted);font-family:inherit;font-weight:800;font-size:11.5px;padding:7px 12px;border-radius:999px;cursor:pointer;white-space:nowrap}
.opt-exp button.on{border-color:var(--gold2);color:var(--gold2);background:rgba(224,166,21,.08)}
.opt-head{display:grid;grid-template-columns:1fr 84px 1fr;font-size:10px;font-weight:900;color:var(--muted);padding:8px 14px;border-bottom:1px solid var(--border);text-align:center}
.opt-head .c{color:var(--green)}.opt-head .p{color:var(--red)}
.opt-row{display:grid;grid-template-columns:1fr 84px 1fr;align-items:center;border-bottom:1px solid var(--border)}
.opt-cell{padding:11px 10px;cursor:pointer;font-size:12.5px;font-weight:800;font-variant-numeric:tabular-nums;text-align:center;transition:background .12s}
.opt-cell:active{background:var(--panel2)}
.opt-cell.call{text-align:start;color:var(--green);background:linear-gradient(90deg,rgba(14,203,129,.07),transparent)}
.opt-cell.put{text-align:end;color:var(--red);background:linear-gradient(270deg,rgba(246,70,93,.07),transparent)}
.opt-cell small{display:block;font-size:9.5px;color:var(--muted);font-weight:700;margin-top:2px}
.opt-strike{text-align:center;font-size:12.5px;font-weight:900;background:var(--panel2);padding:11px 0}
.opt-strike.atm{color:var(--gold2)}
/* ===== شريط نسخ التداول ===== */
.copy-banner{display:flex;align-items:center;gap:12px;margin:12px;padding:14px;border-radius:16px;cursor:pointer;background:linear-gradient(120deg,#1e2530,#141920);border:1px solid var(--border)}
.copy-banner .ci{width:42px;height:42px;border-radius:12px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--gold1),var(--gold2));color:#231a02}
.copy-banner .ci svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2}
.copy-banner .ct{flex:1}
.copy-banner .ct b{display:block;font-size:14px;font-weight:900}
.copy-banner .ct span{font-size:11px;color:var(--muted)}
.copy-banner .cg{color:var(--gold2);font-weight:900;font-size:18px}
/* ===== طبقة منبثقة ===== */
.mdl{position:fixed;inset:0;z-index:999;display:none;background:rgba(0,0,0,.55);backdrop-filter:blur(3px)}
.mdl.on{display:block}
.mdl-sheet{position:absolute;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;background:var(--panel);border-top-left-radius:22px;border-top-right-radius:22px;padding:20px 18px calc(26px + env(safe-area-inset-bottom));box-shadow:0 -8px 30px rgba(0,0,0,.4)}
.mdl-grip{width:42px;height:4px;border-radius:4px;background:var(--border);margin:0 auto 16px}
.mdl-h{font-size:17px;font-weight:900;margin-bottom:4px}
.mdl-sub{font-size:12px;color:var(--muted);margin-bottom:16px;line-height:1.6}
.mdl-amt{display:flex;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--border);border-radius:14px;padding:13px 15px;margin-bottom:12px}
.mdl-amt input{flex:1;background:none;border:0;color:var(--txt);font-family:inherit;font-size:20px;font-weight:900;outline:none;min-width:0}
.mdl-amt .cur{font-size:13px;font-weight:800;color:var(--muted)}
.mdl-row{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);padding:6px 2px}
.mdl-row b{color:var(--txt);font-weight:800}
.mdl-go{width:100%;border:0;border-radius:14px;font-family:inherit;font-size:15px;font-weight:900;padding:15px 0;margin-top:14px;cursor:pointer;color:#231a02}
.mdl-go.buy{background:linear-gradient(135deg,var(--gold1),var(--gold2))}
.mdl-go.yes{background:var(--green);color:#04180f}
.mdl-go.no{background:var(--red);color:#fff}
.mdl-x{width:100%;margin-top:9px;background:none;border:0;color:var(--muted);font-family:inherit;font-size:14px;cursor:pointer;padding:6px}
.mdl-quick{display:flex;gap:8px;margin-bottom:10px}
.mdl-quick button{flex:1;background:var(--panel2);border:1px solid var(--border);color:var(--txt);font-family:inherit;font-weight:800;font-size:12px;padding:9px 0;border-radius:10px;cursor:pointer}
</style>

<script>
const API_BASE='';
const $=id=>document.getElementById(id);
const fmt=(n,d=2)=>Number(n).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
function fmtPx(p){p=+p;if(!isFinite(p)||p<=0)return null;if(p>=1)return p.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});if(p>=0.1)return p.toFixed(4);if(p>=0.001)return p.toFixed(6);return p.toFixed(10).replace(/0+$/,'');}
function fmtVol(v){v=+v;if(!isFinite(v)||v<=0)return '-';if(v>=1e9)return (v/1e9).toFixed(2)+'B';if(v>=1e6)return (v/1e6).toFixed(2)+'M';if(v>=1e3)return (v/1e3).toFixed(1)+'K';return v.toFixed(0);}
function icoUrl(b){return 'https://cdn.jsdelivr.net/gh/atomiclabs/cryptocurrency-icons@1a63530be6e374711a8554f31b17e4cb92c25fa5/128/color/'+b.toLowerCase()+'.png';}
const QUOTES=['USDT','USDC','FDUSD','BUSD','TUSD','BTC','ETH','BNB'];
const STABLE=['USDT','USDC','FDUSD','BUSD','TUSD'];
const MAJ=['BTC','ETH','BNB','SOL','XRP','DOGE','ADA','LTC','LINK','AVAX','DOT','TRX','BCH'];
function splitSym(sym){for(const q of QUOTES){if(sym.endsWith(q)&&sym.length>q.length)return{base:sym.slice(0,-q.length),quote:q};}return{base:sym,quote:''};}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
let ROWS=[];const pxPrev={};
const MSESS=JSON.parse(localStorage.getItem('skygo_session')||'{}');
function _uid(e){var h=0;e=(e||'').toLowerCase();for(var i=0;i<e.length;i++){h=(h*31+e.charCodeAt(i))>>>0;}return(100000000+(h%900000000));}
const FAVKEY='apex_favs_'+_uid(MSESS.email);
function loadFavs(){try{return JSON.parse(localStorage.getItem(FAVKEY)||'[]');}catch(e){return[];}}
let FAVS=loadFavs();
function saveFavs(){localStorage.setItem(FAVKEY,JSON.stringify(FAVS));}
const STAR='<svg viewBox="0 0 24 24"><path d="M12 3l2.9 6 6.1.9-4.5 4.4 1.1 6.3L12 18.6 6.4 20.6l1.1-6.3L3 9.9 9.1 9z"/></svg>';
function toggleFav(e,sym){e.stopPropagation();const i=FAVS.indexOf(sym);if(i>=0)FAVS.splice(i,1);else FAVS.push(sym);saveFavs();render();}
window.toggleFav=toggleFav;
/* تنبيهات الأسعار */
const ALKEY='apex_alerts_'+_uid(MSESS.email);
function loadAlerts(){try{return JSON.parse(localStorage.getItem(ALKEY)||'{}')||{};}catch(e){return{};}}
let ALERTS=loadAlerts();
function saveAlerts(){localStorage.setItem(ALKEY,JSON.stringify(ALERTS));}

function notify(t,b){if('Notification' in window&&Notification.permission==='granted'){try{new Notification(t,{body:b});}catch(e){}}beep();}

function sortList(list){
  const k=SORT.key,s=SORT.dir==='desc'?-1:1;
  return list.sort((a,b)=>{
    if(k==='name')return s*a.base.localeCompare(b.base);
    if(k==='vol')return s*((a.vol||0)-(b.vol||0));
    if(k==='price')return s*((a.price||0)-(b.price||0));

}

  const t=days/365,vol=0.6;
  const intrinsic=isCall?Math.max(spot-strike,0):Math.max(strike-spot,0);
  const tv=spot*vol*Math.sqrt(t)*0.4*Math.exp(-Math.pow((strike-spot)/spot,2)*3);

}

async function poll(){
  try{
    const r=await fetch(API_BASE+'/api/markets',{headers:{'Accept':'application/json'}});
    if(!r.ok)throw new Error('HTTP '+r.status);
    const raw=await r.json();
    const arr=Array.isArray(raw)?raw:(Array.isArray(raw.data)?raw.data:Object.values(raw));
    ROWS=arr.map(d=>{
      const sym=d.symbol||d.s;if(!sym)return null;
      const last=d.lastPrice!=null?d.lastPrice:(d.c!=null?d.c:(d.price!=null?d.price:d.p));
      const pct=d.priceChangePercent!=null?d.priceChangePercent:(d.P!=null?d.P:(d.changePct24h!=null?d.changePct24h:0));
      const vol=d.quoteVolume!=null?d.quoteVolume:(d.q!=null?d.q:(d.volume!=null?d.volume:0));
      const{base,quote}=splitSym(sym);
      return{sym,base,quote,price:parseFloat(last),pct:parseFloat(pct)||0,vol:parseFloat(vol)||0};
    }).filter(Boolean).filter(r=>isFinite(r.price)&&r.price>0);
    if(window.APX&&APX.cfg().enabled){var _t=APX.ticker();var _row={sym:APX.SYM,base:APX.BASE,quote:'USDT',price:APX.live(),pct:parseFloat(_t.priceChangePercent)||0,vol:parseFloat(_t.quoteVolume)||0};var _i=ROWS.findIndex(function(x){return x.sym===APX.SYM;});if(_i>=0)ROWS[_i]=_row;else ROWS.unshift(_row);}
    checkAlerts();
    render();
  }catch(e){}
}
