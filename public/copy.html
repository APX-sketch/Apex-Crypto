<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<script>
(function(){try{var s=JSON.parse(localStorage.getItem('skygo_session')||'null');if(!s||!s.email){location.replace('login.html?next=copy.html');}}catch(e){location.replace('login.html');}})();
</script>
<meta charset="UTF-8">
<script src="i18n.js"></script>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Apex — نسخ التداول</title>
<style>
:root{--bg:#0b0e11;--panel:#141920;--panel2:#1c232c;--border:#252d38;--txt:#eef2f6;--muted:#8a94a3;--gold1:#f8d979;--gold2:#e0a615;--green:#0ecb81;--red:#f6465d}
html[data-theme=light]{--bg:#f6f8fb;--panel:#ffffff;--panel2:#eef1f6;--border:#e2e7ef;--txt:#0d1421;--muted:#6b7686;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Segoe UI',Tahoma,system-ui,sans-serif;background:var(--bg);color:var(--txt);max-width:480px;margin:0 auto;min-height:100vh;position:relative;overflow-x:hidden;padding-bottom:80px}
.hdr{display:flex;align-items:center;gap:10px;padding:calc(12px + env(safe-area-inset-top)) 14px 12px;background:linear-gradient(135deg,#1b1f24,#0f1216);position:sticky;top:0;z-index:20;border-bottom:1px solid var(--border)}
html[data-theme=light] .hdr{background:linear-gradient(135deg,#ffffff,#eef1f6)}
.icobtn{width:38px;height:38px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;background:var(--panel2);border:1px solid var(--border);border-radius:11px;cursor:pointer;color:var(--txt)}
.icobtn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2}
.hdr h1{flex:1;font-size:17px;font-weight:900}
.toptabs{display:flex;padding:10px 14px 2px}
.toptab{padding:6px 2px;margin-inline-end:18px;color:var(--muted);font-weight:800;font-size:14px;cursor:pointer;border-bottom:2px solid transparent}
.toptab.on{color:var(--txt);border-bottom-color:var(--gold2)}
.cbal{margin:10px 14px 4px;padding:16px;border-radius:16px;background:linear-gradient(120deg,#1e2530,#141920);border:1px solid var(--border);position:relative}
html[data-theme=light] .cbal{background:linear-gradient(120deg,#fff,#eef1f6)}
.cbal .lab{font-size:12px;color:var(--muted)}
.cbal .big{font-size:28px;font-weight:900;margin:6px 0 2px;direction:ltr}
.cbal .big small{font-size:14px;color:var(--muted);font-weight:700}
.cbal .sub{display:flex;gap:22px;margin-top:10px}
.cbal .sub .it{font-size:11px;color:var(--muted)}
.cbal .sub .it b{display:block;font-size:14px;font-weight:900;direction:ltr;margin-top:2px;color:var(--txt)}
.cbal .sub .it b.up{color:var(--green)}.cbal .sub .it b.dn{color:var(--red)}
.xfer{position:absolute;top:14px;left:14px;display:flex;align-items:center;gap:5px;background:rgba(224,166,21,.12);border:1px solid var(--gold2);color:var(--gold2);font-size:11.5px;font-weight:800;padding:7px 11px;border-radius:999px;cursor:pointer}
.xfer svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2}
.svcs{display:flex;gap:8px;padding:12px 14px 6px}
.svc{flex:1;background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:12px 6px;text-align:center;cursor:pointer}
.svc .ic{width:30px;height:30px;margin:0 auto 7px;display:flex;align-items:center;justify-content:center;border-radius:10px;background:rgba(224,166,21,.12);color:var(--gold2)}
.svc .ic svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2}
.svc span{font-size:11px;font-weight:800;color:var(--txt);display:block;line-height:1.3}
.filterrow{display:flex;gap:18px;padding:12px 16px 2px}
.filter{color:var(--muted);font-weight:800;font-size:13.5px;cursor:pointer;padding-bottom:5px;border-bottom:2px solid transparent}
.filter.on{color:var(--txt);border-bottom-color:var(--gold2)}
.sortrow{display:flex;gap:7px;overflow-x:auto;padding:8px 14px;scrollbar-width:none;align-items:center}
.sortrow::-webkit-scrollbar{display:none}
.sortrow button{flex:0 0 auto;border:1px solid var(--border);background:var(--panel);color:var(--muted);font-family:inherit;font-weight:800;font-size:11.5px;padding:7px 13px;border-radius:999px;cursor:pointer;white-space:nowrap}
.sortrow button.on{border-color:var(--gold2);color:var(--gold2);background:rgba(224,166,21,.08)}
.wrap{padding:4px 14px}
.tcard{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:14px;margin-bottom:12px}
.tc-top{display:flex;align-items:center;gap:11px;margin-bottom:10px}
.tc-av{width:44px;height:44px;border-radius:14px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:18px;color:#231a02}
.tc-nm{flex:1;min-width:0}
.tc-nm b{font-size:14.5px;font-weight:900;display:flex;align-items:center;gap:6px}
.tc-nm .vrf{color:var(--gold2);font-size:12px}
.tc-nm span{font-size:11px;color:var(--muted);display:block;margin-top:3px}
.badge{display:inline-block;font-size:9.5px;font-weight:800;padding:2px 7px;border-radius:6px;margin-inline-start:5px}
.badge.low{background:rgba(14,203,129,.15);color:var(--green)}
.badge.mid{background:rgba(224,166,21,.15);color:var(--gold2)}
.badge.high{background:rgba(246,70,93,.15);color:var(--red)}
.badge.spot{background:rgba(94,124,255,.16);color:#8fa4ff}
.fav{cursor:pointer;font-size:18px;color:var(--muted);padding:0 2px;line-height:1}
.fav.on{color:var(--gold2)}
.tc-chart{height:52px;margin:2px 0 10px}
.tc-chart svg{width:100%;height:52px;display:block}
.tc-stats{display:flex;gap:4px;margin-bottom:12px}
.tc-stats .s{flex:1;text-align:center}
.tc-stats .s b{font-size:13px;font-weight:900;display:block;direction:ltr}
.tc-stats .s span{font-size:9.5px;color:var(--muted)}
.tc-roi{text-align:end;flex:0 0 auto;direction:ltr}
.tc-roi b{font-size:20px;font-weight:900;color:var(--green);display:block}
.tc-roi.dn b{color:var(--red)}
.tc-roi span{font-size:10px;color:var(--muted)}
.tc-btn{width:100%;border:0;border-radius:12px;font-family:inherit;font-weight:900;font-size:14px;padding:12px 0;cursor:pointer;background:linear-gradient(135deg,var(--gold1),var(--gold2));color:#231a02}
.tc-btn:active{transform:scale(.98)}
.tc-btn.copying{background:var(--panel2);color:var(--muted);border:1px solid var(--border)}
.empty{padding:54px 24px;text-align:center;color:var(--muted)}
.empty .big{font-size:40px;margin-bottom:10px}
.empty b{display:block;color:var(--txt);font-size:15px;margin-bottom:6px}
.empty p{font-size:12.5px;line-height:1.7}
.mc{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:14px;margin-bottom:12px}
.mc-top{display:flex;align-items:center;gap:11px}
.mc-top .tc-av{width:40px;height:40px;font-size:16px;border-radius:12px}
.mc-top .nm{flex:1}
.mc-top .nm b{font-size:14px;font-weight:900}
.mc-top .nm span{font-size:11px;color:var(--muted);display:block;margin-top:2px}
.mc-pnl{text-align:end}
.mc-pnl b{font-size:16px;font-weight:900;direction:ltr;display:block}
.mc-pnl.up b{color:var(--green)}.mc-pnl.dn b{color:var(--red)}
.mc-pnl span{font-size:10px;color:var(--muted)}
.mc-info{display:flex;gap:4px;margin:12px 0}
.mc-info .s{flex:1;text-align:center;background:var(--panel2);border-radius:10px;padding:8px 4px}
.mc-info .s b{font-size:12.5px;font-weight:900;display:block;direction:ltr}
.mc-info .s span{font-size:9.5px;color:var(--muted)}
.mc-settings{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.chip{font-size:10px;font-weight:800;padding:4px 9px;border-radius:8px;background:var(--panel2);color:var(--muted);border:1px solid var(--border)}
.mc-stop{width:100%;border:1px solid var(--red);background:rgba(246,70,93,.1);color:var(--red);border-radius:11px;font-family:inherit;font-weight:800;font-size:13px;padding:10px 0;cursor:pointer}
.mc-mng{width:100%;border:1px solid var(--border);background:var(--panel2);color:var(--txt);border-radius:11px;font-family:inherit;font-weight:800;font-size:12.5px;padding:9px 0;cursor:pointer;margin-bottom:8px}
.mdl{position:fixed;inset:0;z-index:999;display:none;background:rgba(0,0,0,.55);backdrop-filter:blur(3px)}
.mdl.on{display:flex;align-items:center;justify-content:center;padding:16px}
.mdl-sheet{position:relative;left:auto;right:auto;bottom:auto;width:100%;max-width:440px;margin:0 auto;background:var(--panel);border-radius:22px;padding:22px 18px calc(20px + env(safe-area-inset-bottom));box-shadow:0 18px 50px rgba(0,0,0,.55);max-height:88vh;overflow-y:auto}
.mdl-grip{width:42px;height:4px;border-radius:4px;background:var(--border);margin:0 auto 16px}
.mdl-h{font-size:17px;font-weight:900;margin-bottom:4px}
.mdl-sub{font-size:12px;color:var(--muted);margin-bottom:14px;line-height:1.65}
.trdr-head{display:flex;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--border);border-radius:14px;padding:11px 13px;margin-bottom:12px}
.trdr-head .tc-av{width:38px;height:38px;font-size:15px;border-radius:12px}
.trdr-head .n{flex:1}
.trdr-head .n b{font-size:13.5px;font-weight:900;display:block}
.trdr-head .n span{font-size:10.5px;color:var(--muted)}
.trdr-head .ps{font-size:10.5px;color:var(--gold2);font-weight:800;background:rgba(224,166,21,.12);border:1px solid var(--gold2);border-radius:999px;padding:5px 9px;direction:ltr}
.lbl{font-size:12px;font-weight:800;color:var(--muted);margin:14px 2px 7px;display:flex;justify-content:space-between}
.lbl i{font-style:normal;color:var(--muted);font-weight:700;font-size:11px}
.mdl-amt{display:flex;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--border);border-radius:14px;padding:13px 15px}
.mdl-amt input{flex:1;background:none;border:0;color:var(--txt);font-family:inherit;font-size:19px;font-weight:900;outline:none;min-width:0;direction:ltr}
.mdl-amt .cur{font-size:13px;font-weight:800;color:var(--muted)}
.mdl-quick{display:flex;gap:8px;margin-top:9px}
.mdl-quick button{flex:1;background:var(--panel2);border:1px solid var(--border);color:var(--txt);font-family:inherit;font-weight:800;font-size:12px;padding:9px 0;border-radius:10px;cursor:pointer}
.seg{display:flex;gap:8px}
.seg button{flex:1;background:var(--panel2);border:1px solid var(--border);color:var(--muted);font-family:inherit;font-weight:800;font-size:12.5px;padding:10px 0;border-radius:11px;cursor:pointer}
.seg button.on{border-color:var(--gold2);color:var(--gold2);background:rgba(224,166,21,.1)}
.mult{display:flex;gap:8px}
.mult button{flex:1;background:var(--panel2);border:1px solid var(--border);color:var(--txt);font-family:inherit;font-weight:800;font-size:13px;padding:10px 0;border-radius:11px;cursor:pointer}
.mult button.on{border-color:var(--gold2);color:var(--gold2);background:rgba(224,166,21,.1)}
.mdl-row{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);padding:7px 2px}
.mdl-row b{color:var(--txt);font-weight:800;direction:ltr}
.rows2{display:flex;gap:8px}
.rows2 .mdl-amt{flex:1;padding:11px 12px}
.rows2 .mdl-amt input{font-size:15px}
.sw{display:flex;align-items:flex-start;gap:10px;padding:10px 2px}
.sw .t{flex:1}
.sw .t b{font-size:12.5px;font-weight:800;display:block}
.sw .t span{font-size:10.5px;color:var(--muted);display:block;margin-top:2px;line-height:1.5}
.toggle{flex:0 0 auto;width:42px;height:24px;border-radius:999px;background:var(--border);position:relative;cursor:pointer;transition:.2s;margin-top:2px}
.toggle:after{content:'';position:absolute;top:3px;right:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s}
.toggle.on{background:var(--gold2)}
.toggle.on:after{right:21px}
.acc{background:var(--panel2);border:1px solid var(--border);border-radius:14px;margin-top:10px;overflow:hidden}
.acc-h{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;font-size:12.5px;font-weight:800;cursor:pointer}
.acc-h span{color:var(--muted);font-size:11px;font-weight:700}
.acc-b{display:none;padding:0 14px 12px}
.acc.on .acc-b{display:block}
.agr{display:flex;align-items:flex-start;gap:9px;margin-top:16px;font-size:11.5px;color:var(--muted);line-height:1.6}
.agr .box{flex:0 0 auto;width:18px;height:18px;border-radius:5px;border:1.5px solid var(--border);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:12px;color:transparent;margin-top:1px}
.agr .box.on{background:var(--gold2);border-color:var(--gold2);color:#231a02}
.mdl-go{width:100%;border:0;border-radius:14px;font-family:inherit;font-size:15px;font-weight:900;padding:15px 0;margin-top:14px;cursor:pointer;background:linear-gradient(135deg,var(--gold1),var(--gold2));color:#231a02}
.mdl-go:disabled{opacity:.45;cursor:not-allowed}
.mdl-x{width:100%;margin-top:9px;background:none;border:0;color:var(--muted);font-family:inherit;font-size:14px;cursor:pointer;padding:6px}
.note{font-size:11.5px;color:var(--muted);line-height:1.65;background:var(--panel2);border:1px solid var(--border);border-radius:12px;padding:10px 12px;margin-top:12px}
.note b{color:var(--gold2)}
.tin{width:100%;background:var(--panel2);border:1px solid var(--border);border-radius:12px;padding:12px 14px;color:var(--txt);font-family:inherit;font-size:14px;outline:none;margin-top:6px}
.pickrow{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}
.pickrow button{border:1px solid var(--border);background:var(--panel2);color:var(--muted);font-family:inherit;font-weight:800;font-size:11.5px;padding:7px 12px;border-radius:999px;cursor:pointer}
.pickrow button.on{border-color:var(--gold2);color:var(--gold2);background:rgba(224,166,21,.08)}
.toast{position:fixed;bottom:90px;left:50%;transform:translate(-50%,20px);background:#20272f;color:#fff;padding:12px 18px;border-radius:12px;font-size:13px;font-weight:700;opacity:0;transition:.3s;z-index:1000;pointer-events:none;border:1px solid var(--border);max-width:88%;text-align:center}
.toast.show{transform:translate(-50%,0);opacity:1}
.bnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;display:grid;grid-template-columns:repeat(6,1fr);background:#0f1216;border-top:1px solid var(--border);padding:8px 0 calc(8px + env(safe-area-inset-bottom));z-index:30}
html[data-theme=light] .bnav{background:#fff}
.bnav a{display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--muted);text-decoration:none;font-size:10px;font-weight:700}
.bnav a svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8}
.bnav a.active{color:var(--gold2)}
/* حاسبة تقدير الأرباح */
.est{background:linear-gradient(120deg,rgba(224,166,21,.10),rgba(224,166,21,.03));border:1px solid var(--gold2);border-radius:14px;padding:12px 14px;margin-top:12px}
.est .eh{font-size:12px;font-weight:900;color:var(--gold2);display:flex;align-items:center;gap:6px;margin-bottom:8px}
.est .eh svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2}
.est .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.est .cell{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:9px 11px}
.est .cell span{font-size:10px;color:var(--muted);display:block}
.est .cell b{font-size:15px;font-weight:900;direction:ltr;display:block;margin-top:3px}
.est .cell b.up{color:var(--green)}.est .cell b.dn{color:var(--red)}
.est .foot{font-size:10.5px;color:var(--muted);margin-top:8px;line-height:1.6}
/* جدول مقارنة المتداولين */
.cmpwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--border);border-radius:14px;margin-top:6px}
table.cmp{width:100%;min-width:620px;border-collapse:collapse;font-size:11.5px}
table.cmp th,table.cmp td{padding:9px 8px;text-align:center;border-bottom:1px solid var(--border);white-space:nowrap}
table.cmp th{background:var(--panel2);color:var(--muted);font-weight:800;font-size:10.5px;position:sticky;top:0}
table.cmp td{color:var(--txt);font-weight:800}
table.cmp td.ltr{direction:ltr}
table.cmp tr:last-child td{border-bottom:0}
table.cmp td.name{text-align:start;font-weight:900;display:flex;align-items:center;gap:7px}
table.cmp .av{width:24px;height:24px;border-radius:8px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:12px;color:#231a02;font-weight:900}
table.cmp .up{color:var(--green)}table.cmp .dn{color:var(--red)}
table.cmp .medal{font-size:13px}
.chk{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:6px;background:var(--panel2);border:1px solid var(--border);cursor:pointer;color:transparent;font-size:12px}
.chk.on{background:var(--gold2);border-color:var(--gold2);color:#231a02}
.cmpbar{display:flex;align-items:center;gap:8px;margin:12px 2px 4px;flex-wrap:wrap}
.cmpbar button{border:1px solid var(--border);background:var(--panel);color:var(--txt);font-family:inherit;font-weight:800;font-size:12px;padding:9px 14px;border-radius:999px;cursor:pointer}
.cmpbar button.primary{background:linear-gradient(135deg,var(--gold1),var(--gold2));color:#231a02;border:0}
</style>
</head>
<body>
<div class="hdr">
  <div class="icobtn" onclick="location.href='futures.html'"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></div>
  <h1>نسخ التداول</h1>
  <div class="icobtn" onclick="openAlerts()" style="position:relative"><svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 10-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg><span id="alertDot" style="display:none;position:absolute;top:6px;left:6px;width:8px;height:8px;border-radius:50%;background:var(--red)"></span></div>
</div>

<div class="toptabs">
  <div class="toptab on" data-t="futures" onclick="setMarket('futures')">العقود الآجلة</div>
  <div class="toptab" data-t="spot" onclick="setMarket('spot')">التداول الفوري</div>
</div>

<div class="cbal">
  <div class="xfer" onclick="openTransfer()"><svg viewBox="0 0 24 24"><path d="M7 7h11l-3-3M17 17H6l3 3"/></svg> تحويل رصيد</div>
  <div class="lab">رصيد النسخ (USDT)</div>
  <div class="big" id="copyBal">0.00 <small>USDT</small></div>
  <div class="sub">
    <div class="it">الأرباح والخسائر غير المحققة<b id="copyUpnl">0.00</b></div>
    <div class="it">النسخ النشطة<b id="copyCnt" style="color:var(--txt)">0</b></div>
  </div>
</div>

<div class="svcs">
  <div class="svc" id="svcRoom" onclick="openRoom()" style="display:none"><div class="ic"><svg viewBox="0 0 24 24"><path d="M3 20h18M6 20V9l6-5 6 5v11M10 20v-5h4v5"/></svg></div><span>غرفة التداول</span></div>
  <div class="svc" onclick="goPerf()"><div class="ic"><svg viewBox="0 0 24 24"><path d="M4 19V5M4 19h16M8 16l3-4 3 2 5-7"/></svg></div><span>الأداء والإحصائيات</span></div>
  <div class="svc" onclick="openCompare()"><div class="ic"><svg viewBox="0 0 24 24"><path d="M12 3v18M7 8H3l2-3 2 3H3M21 8h-4l2-3 2 3h-4M5 8v4a3 3 0 006 0V8M13 8v4a3 3 0 006 0V8"/></svg></div><span>مقارنة المتداولين</span></div>
  <div class="svc" onclick="openApply()"><div class="ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.2"/><path d="M5 20c0-3.3 3.1-5.5 7-5.5s7 2.2 7 5.5"/></svg></div><span>كن متداولاً رئيسياً</span></div>
  <div class="svc" onclick="openLearn()"><div class="ic"><svg viewBox="0 0 24 24"><path d="M12 4l8 4-8 4-8-4zM6 10v5c0 1.6 2.7 3 6 3s6-1.4 6-3v-5"/></svg></div><span>الدروس</span></div>
</div>

<div id="perfPane" style="display:none">
  <div class="wrap" id="perfBody"></div>
</div>

<div id="cmpPane" style="display:none">
  <div class="wrap" id="cmpBody"></div>
</div>

<div class="filterrow" id="filterRow">
  <div class="filter on" data-f="rec" onclick="setFilter('rec')">موصى به</div>
  <div class="filter" data-f="all" onclick="setFilter('all')">الكل</div>

<script>
var $=function(id){return document.getElementById(id);};
var fmt=function(n,d){d=(d==null?2:d);return Number(n||0).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});};
function fmtK(v){v=+v||0;if(v>=1e9)return (v/1e9).toFixed(2)+'B';if(v>=1e6)return (v/1e6).toFixed(2)+'M';if(v>=1e3)return (v/1e3).toFixed(1)+'K';return String(Math.round(v));}
function toast(m){var e=$('toast');e.textContent=m;e.className='toast show';clearTimeout(window._t);window._t=setTimeout(function(){e.className='toast';},2600);}
var SESS=JSON.parse(localStorage.getItem('skygo_session')||'{}');
var TOKEN=SESS.token||SESS.jwt||'';
function api(path,opts){
  opts=opts||{};
  var h={'Content-Type':'application/json'};
  if(TOKEN)h['Authorization']='Bearer '+TOKEN;
  return fetch(path,{method:opts.method||'GET',headers:h,credentials:'include',body:opts.body}).then(function(r){
    return r.json().catch(function(){return {};}).then(function(j){if(!r.ok)throw (j&&j.error)||('http_'+r.status);return j;});
  });
}
function money(v){return (v>=0?'+':'-')+'$'+fmt(Math.abs(v),2);}
var TRADERS=[],IS_TRADER=false,MYSET={},MINE=[],WALLET={avail:0,locked:0},MARKET='futures';
var SORT='roi',FILTER='rec',FAV=(function(){try{return JSON.parse(localStorage.getItem('apex_copy_fav')||'[]');}catch(e){return [];}})();
function saveFav(){try{localStorage.setItem('apex_copy_fav',JSON.stringify(FAV));}catch(e){}}
var RISK={low:['منخفضة','low'],mid:['متوسطة','mid'],high:['عالية','high']};
function colorFor(id){var c=['#f0b90b','#5e7cff','#0ecb81','#f6465d','#19c2c2','#b06df0','#e0a615','#ff8a3d'];return c[Math.abs(Number(id)||1)%c.length];}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function seedRand(str){var h=2166136261;str=String(str);for(var i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619);}return function(){h+=0x6D2B79F5;var t=Math.imul(h^h>>>15,1|h);t^=t+Math.imul(t^t>>>7,61|t);return ((t^t>>>14)>>>0)/4294967296;};}
function spark(id,color){
  var r=seedRand('sp'+id),n=24,pts=[],v=50;
  for(var i=0;i<n;i++){v+=(r()-0.4)*14;v=Math.max(8,Math.min(92,v));pts.push(v);}
  var W=300,H=52,mn=Math.min.apply(null,pts),mx=Math.max.apply(null,pts),sp=(mx-mn)||1;
  var line=pts.map(function(p,i){return (i/(n-1)*W).toFixed(1)+','+(H-2-((p-mn)/sp)*(H-6)).toFixed(1);});
  var gid='g'+String(id).replace(/[^a-zA-Z0-9]/g,'');
  return '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none"><defs><linearGradient id="'+gid+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+color+'" stop-opacity=".35"/><stop offset="1" stop-color="'+color+'" stop-opacity="0"/></linearGradient></defs><polygon points="'+line.join(' ')+' '+W+','+H+' 0,'+H+'" fill="url(#'+gid+')"/><polyline points="'+line.join(' ')+'" fill="none" stroke="'+color+'" stroke-width="2"/></svg>';
}
function nowStamp(){return Date.now();}
function days(n){return Math.max(0.1,((n==null?nowStamp():n)?(nowStamp()-Number(n))/86400000:1));}
function setMarket(m){MARKET=m;document.querySelectorAll('.toptab').forEach(function(x){x.classList.toggle('on',x.dataset.t===m);});renderTraders();}
function setFilter(f){FILTER=f;document.querySelectorAll('#filterRow .filter').forEach(function(x){x.classList.toggle('on',x.dataset.f===f);});renderTraders();}
function toggleFav(id,e){if(e&&e.stopPropagation)e.stopPropagation();var i=FAV.indexOf(id);if(i>=0)FAV.splice(i,1);else FAV.push(id);saveFav();renderTraders();}
function toggleStar(id,e){toggleFav(id,e);}
function marketOf(t){return (String(t.kind||'futures')==='spot')?'spot':'futures';}
function visibleTraders(){
  var list=TRADERS.filter(function(t){return marketOf(t)===MARKET;});
  if(FILTER==='fav')list=list.filter(function(t){return FAV.indexOf(t.user_id)>=0;});
  else if(FILTER==='rec')list=list.filter(function(t){return (+t.roi30||0)>0 && (+t.followers||0)>0;});
  var key=SORT==='roi'?'roi30':(SORT==='win'?'win_rate':SORT);
  return list.sort(function(a,b){return (+b[key]||0)-(+a[key]||0);});
}
function tcard(t){
  var rk=RISK[t.risk]||RISK.mid,color=colorFor(t.user_id),copying=!!MYSET[t.user_id],roi=+t.roi30||0;
  var fav=FAV.indexOf(t.user_id)>=0;
  var spot=(marketOf(t)==='spot');
  return '<div class="tcard">'+
    '<div class="tc-top"><div class="tc-av" style="background:linear-gradient(135deg,'+color+',#231a02)">'+esc((t.display_name||'?').charAt(0))+'</div>'+
      '<div class="tc-nm"><b>'+esc(t.display_name)+' <span class="vrf">✔</span>'+
        (spot?'<span class="badge spot">فوري</span>':'')+'</b>'+
        '<span>'+esc(t.strategy||'تداول كريبتو')+'<span class="badge '+rk[1]+'">'+rk[0]+'</span></span></div>'+
      '<div class="fav'+(fav?' on':'')+'" onclick="toggleFav('+t.user_id+',event)">'+(fav?'★':'☆')+'</div></div>'+
    '<div class="tc-stats"><div class="s"><b style="color:var(--green)">توزيع أرباح '+fmt(+t.profit_share||0,0)+'%</b><span>مشاركة الأرباح</span></div>'+
      '<div class="s"><b>'+fmt(+t.win_rate||0,0)+'%</b><span>نسبة نجاح</span></div>'+
      '<div class="s"><b>'+fmtK(t.followers)+'</b><span>ناسخ</span></div></div>'+
    '<div style="display:flex;align-items:center;gap:10px"><div class="tc-chart" style="flex:1;margin:0">'+spark(t.user_id,color)+'</div>'+
      '<div class="tc-roi'+(roi<0?' dn':'')+'"><b>'+(roi>=0?'+':'')+roi.toFixed(1)+'%</b><span>عائد 30 يوم</span></div></div>'+
    '<div class="tc-stats" style="margin-top:10px"><div class="s"><b>$'+fmtK(t.aum)+'</b><span>أصول مدراة</span></div>'+
      '<div class="s"><b>'+(+t.reviews||0)+'</b><span>تقييم</span></div>'+
      '<div class="s"><b>'+(Number(t.rating)||0).toFixed(1)+' ★</b><span>متوسط التقييم</span></div></div>'+
    '<button class="tc-btn'+(copying?' copying':'')+'" onclick="'+(copying?'goMine()':('openCopy('+t.user_id+')'))+'">'+(copying?'✓ تنسخه الآن — إدارة':'نسخ')+'</button></div>';
}
function renderTraders(){
  var list=visibleTraders();
  if(!list.length){
    var msg=(FILTER==='fav')?'<div class="empty"><div class="big">☆</div><b>لا مفضلين بعد</b><p>اضغط النجمة على بطاقة أي متداول لإضافته إلى المفضلة.</p></div>'
      :'<div class="empty"><div class="big">👤</div><b>لا متداولون بعد</b><p>كن أول من يقدّم طلباً ليصبح متداولاً يُنسخ — اضغط «كن متداولاً رئيسياً» بالأعلى.</p></div>';
    $('tradersList').innerHTML=msg;
  } else $('tradersList').innerHTML=list.map(tcard).join('');
  $('copyCnt').textContent=Object.keys(MYSET).length;
}
function loadTraders(){
  return api('/api/copy/traders').then(function(d){
    TRADERS=d.traders||[];IS_TRADER=!!d.isTrader;MYSET={};
    TRADERS.forEach(function(t){if(+t.iCopy>0)MYSET[t.user_id]=true;});
    renderTraders();
  }).catch(function(){
    $('tradersList').innerHTML='<div class="empty"><div class="big">⚠️</div><b>تعذّر التحميل</b><p>تأكد من الاتصال وأعد المحاولة.</p></div>';
  });
}
// ---- رصيد محفظة النسخ + نسخي ----
function refreshWallet(){
  return api('/api/copy/mine').then(function(d){
    MINE=d.copies||[];WALLET=d.wallet||{avail:0,locked:0};
    var active=MINE.filter(function(c){return +c.followed;});
    var upnl=0;active.forEach(function(c){upnl+=(+c.profit||0);});
    var total=(+WALLET.avail||0)+(+WALLET.locked||0);
    var bEl=$('copyBal');if(bEl)bEl.innerHTML=fmt(total,2)+' <small>USDT</small>';
    var uEl=$('copyUpnl');if(uEl){uEl.textContent=money(upnl).replace('$','');uEl.className=upnl>=0?'up':'dn';}
    var cEl=$('copyCnt');if(cEl)cEl.textContent=active.length;
    if(MINEVIEW)renderMine();
    return d;
  }).catch(function(){});
}
var MINEVIEW=false;
function goMine(){MINEVIEW=true;PERFVIEW=false;CMPVIEW=false;$('perfPane').style.display='none';$('cmpPane').style.display='none';$('tradersList').style.display='none';$('mineList').style.display='block';renderMine();window.scrollTo(0,0);}
function mineCard(c){
  var color=colorFor(c.trader_id),profit=+c.profit||0,amt=+c.amount||0,up=profit>=0;
  var modeTxt=(c.mode==='ratio')?'معدّل ثابت':'مبلغ ثابت';
  var chips=[];
  chips.push('<span class="chip">'+modeTxt+'</span>');
  chips.push('<span class="chip">مضاعف '+(+c.multiplier||1)+'x</span>');
  if(+c.stop_loss>0)chips.push('<span class="chip">إيقاف خسارة '+fmt(+c.stop_loss,0)+'%</span>');
  if(+c.auto_stop)chips.push('<span class="chip" style="color:var(--gold2);border-color:var(--gold2)">إيقاف تلقائي عند الخسارة</span>');
  if(+c.stopped)chips.push('<span class="chip" style="color:var(--red);border-color:var(--red)">توقف تلقائياً — بلغ حدّ الخسارة</span>');
  if(+c.copy_all)chips.push('<span class="chip">نسخ كل الأرصدة</span>');
  if(+c.auto_invest)chips.push('<span class="chip">استثمار تلقائي</span>');
  var paused=!+c.followed;
  return '<div class="mc"><div class="mc-top"><div class="tc-av" style="background:linear-gradient(135deg,'+color+',#231a02)">'+esc((c.display_name||'?').charAt(0))+'</div>'+
    '<div class="nm"><b>'+esc(c.display_name)+(paused?' <span style="color:var(--muted);font-size:10px">(موقوف)</span>':'')+'</b><span>توزيع الأرباح '+fmt(+c.profit_share||0,0)+'% · عائد المتداول '+(+c.roi30>=0?'+':'')+fmt(+c.roi30||0,1)+'%</span></div>'+
    '<div class="mc-pnl '+(up?'up':'dn')+'"><b>'+money(profit)+'</b><span>الربح المحقق</span></div></div>'+
    '<div class="mc-info"><div class="s"><b>$'+fmt(amt,2)+'</b><span>مبلغ النسخ</span></div>'+
      '<div class="s"><b>$'+fmt(amt+profit,2)+'</b><span>القيمة الحالية</span></div>'+
      '<div class="s"><b style="color:'+(up?'var(--green)':'var(--red)')+'">'+(amt>0?((profit/amt*100>=0?'+':'')+fmt(profit/amt*100,2)+'%'):'0%')+'</b><span>العائد</span></div></div>'+
    '<div class="mc-settings">'+chips.join('')+'</div>'+
    '<button class="mc-mng" onclick="openCopy('+c.trader_id+')">⚙️ تعديل إعدادات النسخ</button>'+
    '<button class="mc-stop" onclick="stopCopy('+c.trader_id+','+amt+')">إيقاف النسخ وفكّ $'+fmt(amt,2)+'</button></div>';
}
function renderMine(){
  var active=MINE.filter(function(c){return +c.followed || +c.amount>0;});
  var head='<div style="display:flex;align-items:center;gap:10px;margin:2px 2px 12px"><div style="flex:1;font-size:15px;font-weight:900">النسخ النشطة</div>'+
    '<button onclick="goTraders()" style="background:var(--panel2);border:1px solid var(--border);color:var(--txt);font-family:inherit;font-weight:800;font-size:12px;padding:8px 13px;border-radius:999px;cursor:pointer">→ استكشاف متداولين</button></div>';
  if(IS_TRADER)head+='<button onclick="openTradePanel()" style="width:100%;border:0;border-radius:12px;font-family:inherit;font-weight:900;font-size:13px;padding:11px 0;margin-bottom:12px;cursor:pointer;background:rgba(14,203,129,.12);border:1px solid var(--green);color:var(--green)">📊 سجّل صفقة كمتداول رئيسي / سوّ صفقاتك</button>';
  if(!active.length){$('mineList').innerHTML=head+'<div class="empty"><div class="big">📋</div><b>لا تنسخ أحداً بعد</b><p>اختر متداولاً ناجحاً وابدأ النسخ. رصيدك لا يتغيّر إلا عند إغلاق صفقات المتداول الفعلية.</p></div>';return;}
  $('mineList').innerHTML=head+active.map(mineCard).join('');
}
// ================= شاشة 2: إعدادات نسخ التداول =================
var CUR=null,CMODE='fixed',CMULT=1,CAGREE=false,CADV=false;
var CFLAGS={copy_all:false,auto_invest:false,sell_on_stop:true,auto_stop:true};
var SYMS=['BTCUSDT','ETHUSDT','BNBUSDT','SOLUSDT','XRPUSDT','ADAUSDT','DOGEUSDT','TONUSDT'];
var CSYM={BTCUSDT:true,ETHUSDT:true};
function openCopy(id){
  var t=null;for(var i=0;i<TRADERS.length;i++){if(String(TRADERS[i].user_id)===String(id)){t=TRADERS[i];break;}}
  if(!t){var m=MINE.filter(function(c){return String(c.trader_id)===String(id);})[0];if(m)t={user_id:m.trader_id,display_name:m.display_name,roi30:m.roi30,profit_share:m.profit_share,risk:m.risk,kind:m.kind};}
  if(!t)return;CUR=t;CMODE='fixed';CMULT=1;CAGREE=false;CADV=false;
  var ex=MINE.filter(function(c){return String(c.trader_id)===String(id);})[0];
  CFLAGS={copy_all:ex?!!+ex.copy_all:false,auto_invest:ex?!!+ex.auto_invest:false,sell_on_stop:ex?!!+ex.sell_on_stop:true,auto_stop:ex?!!+ex.auto_stop:true};
  CSYM={};(ex&&ex.symbols?String(ex.symbols).split(','):['BTCUSDT','ETHUSDT']).forEach(function(s){if(s)CSYM[s.trim()]=true;});
  var freeAmt=Math.max(0,(+WALLET.avail||0)-(+WALLET.locked||0));
  var sheet=$('mdlSheet');
  sheet.innerHTML='<div class="mdl-grip"></div>'+
    '<div class="mdl-h">إعدادات نسخ '+(marketOf(t)==='spot'?'التداول الفوري':'العقود الآجلة')+'</div>'+
    '<div class="mdl-sub">ستُنسخ صفقات المتداول على حسابك؛ الربح/الخسارة تتحقق فعلياً عند إغلاق صفقاته.</div>'+
    '<div class="trdr-head"><div class="tc-av" style="background:linear-gradient(135deg,'+colorFor(t.user_id)+',#231a02)">'+esc((t.display_name||'?').charAt(0))+'</div>'+
      '<div class="n"><b>'+esc(t.display_name)+'</b><span>عائد 30 يوم '+(+t.roi30>=0?'+':'')+fmt(+t.roi30||0,1)+'%</span></div>'+
      '<div class="ps">Profit Sharing '+fmt(+t.profit_share||0,0)+'%</div></div>'+
    '<div class="seg"><button id="segFixed" class="on" onclick="cMode(\'fixed\')">مبلغ ثابت</button><button id="segRatio" onclick="cMode(\'ratio\')">معدّل ثابت</button></div>'+
    '<div class="lbl">مبلغ النسخ (USDT)<i>100.00 - 200,000.00</i></div>'+
    '<div class="mdl-amt"><input id="cAmt" type="text" inputmode="decimal" placeholder="100.00" value="'+(ex?fmt(+ex.amount,2):'')+'" oninput="cCalc()"><span class="cur">USDT</span></div>'+
    '<div class="mdl-quick"><button onclick="cSet(100)">100</button><button onclick="cSet(500)">500</button><button onclick="cSet(1000)">1000</button><button onclick="cSet(5000)">5000</button></div>'+
    '<div class="est" id="cEst"><div class="eh"><svg viewBox="0 0 24 24"><path d="M4 19V5M4 19h16M8 16l3-4 3 2 5-7"/></svg>حاسبة تقدير الأرباح التلقائية</div><div id="cEstBody"></div></div>'+
    '<div class="mdl-row" style="margin-top:8px"><span>الرصيد المتاح في محفظة النسخ</span><b id="cFree">'+fmt(freeAmt,2)+' USDT</b></div>'+
    '<div class="mdl-row" style="margin-top:8px"><span>الرصيد المتاح في محفظة النسخ</span><b id="cFree">'+fmt(freeAmt,2)+' USDT</b></div>'+
    '<div class="lbl">مضاعف حجم الصفقة</div>'+
    '<div class="mult" id="multRow"><button class="on" onclick="cMult(1)">1x</button><button onclick="cMult(2)">2x</button><button onclick="cMult(5)">5x</button><button onclick="cMult(10)">10x</button></div>'+
    '<div class="lbl">تفضيل الرمز <i id="symCnt"></i></div>'+
    '<div class="pickrow" id="symRow">'+SYMS.map(function(s){return '<button class="'+(CSYM[s]?'on':'')+'" onclick="cSym(\''+s+'\',this)">'+s.replace('USDT','')+'</button>';}).join('')+'</div>'+
    '<div class="lbl">إيقاف الخسارة الإجمالي <i><span id="slVal">'+(ex?fmt(+ex.stop_loss,0):'0')+'</span>%</i></div>'+
    '<input id="cSL" type="range" min="0" max="95" step="5" value="'+(ex?(+ex.stop_loss):0)+'" oninput="$(\'slVal\').textContent=this.value;cCalc()" style="width:100%;accent-color:var(--gold2)">'+
    '<div class="sw" style="padding-top:4px"><div class="t"><b>إيقاف النسخ تلقائياً عند بلوغ الخسارة</b><span>عندما تبلغ الخسارة حدّ الإيقاف المُحدّد أعلاه، تُوقف نسخ هذا المتداول تلقائياً ويُفكّ المبلغ المتبقي.</span></div><div class="toggle'+((ex?!!+ex.auto_stop:true)?' on':'')+'" id="swAutoStop" onclick="cFlag(\'auto_stop\',this)"></div></div>'+
    '<div class="acc" id="advAcc"><div class="acc-h" onclick="cAdv()"><span style="color:var(--txt)">الإعدادات المتقدمة</span><span id="advArrow">▾</span></div><div class="acc-b">'+
      '<div class="sw"><div class="t"><b>نسخ جميع أرصدة المتداول الرئيسي</b><span>محاكاة كامل محفظة المتداول</span></div><div class="toggle'+(CFLAGS.copy_all?' on':'')+'" id="swCopyAll" onclick="cFlag(\'copy_all\',this)"></div></div>'+
      '<div class="sw"><div class="t"><b>الاستثمار التلقائي</b><span>إعادة استثمار الأرباح المحققة تلقائياً</span></div><div class="toggle'+(CFLAGS.auto_invest?' on':'')+'" id="swAuto" onclick="cFlag(\'auto_invest\',this)"></div></div>'+
      '<div class="sw"><div class="t"><b>بيع جميع الأرصدة عند الإيقاف</b><span>تسوية المراكز عند إيقاف النسخ</span></div><div class="toggle'+(CFLAGS.sell_on_stop?' on':'')+'" id="swSell" onclick="cFlag(\'sell_on_stop\',this)"></div></div>'+
      '<div class="lbl" style="margin-top:8px">الحد الأقصى للانزلاق عند الدخول</div>'+

function cCalc(){
  var box=$('cEstBody');if(!box)return;
  var a=$('cAmt'),amt=a?(parseFloat(a.value)||0):0;
  var roi=CUR?(+CUR.roi30||0):0,share=CUR?(+CUR.profit_share||0):0;
  var sl=parseFloat(($('cSL')||{}).value||0);
  if(amt<=0){box.innerHTML='<div class="foot">أدخل مبلغ النسخ لعرض تقدير الأرباح المتوقعة بناءً على أداء المتداول (عائد 30 يوم) وحجم نسخك والمضاعف.</div>';return;}
  var eff=amt*CMULT;
  function net(f){var g=eff*(roi/100)*f;return g>0?g*(1-share/100):g;}
  var mid=net(1),low=net(0.4),high=net(1.6);
  var maxLoss=sl>0?(-amt*(sl/100)):null;
  function cell(lbl,val,sub){var up=val>=0;return '<div class="cell"><span>'+lbl+'</span><b class="'+(up?'up':'dn')+'">'+(up?'+':'-')+'$'+fmt(Math.abs(val),2)+'</b>'+(sub?'<span style="margin-top:2px">'+sub+'</span>':'')+'</div>';}
  var html='<div class="grid2">'+
    cell('تقدير متوقّع (30ي)',mid,'ربح صافٍ بعد مشاركة '+fmt(share,0)+'%')+
    cell('القيمة النهائية',amt+mid,'من رأس مال $'+fmt(amt,2))+
    cell('سيناريو محافظ',low,'عند 40% من الأداء')+
    cell('سيناريو متفائل',high,'عند 160% من الأداء')+
  '</div>';
  html+='<div class="foot">التقدير = المبلغ × المضاعف ('+CMULT+'x) × عائد المتداول ('+(roi>=0?'+':'')+fmt(roi,1)+'%). '+(maxLoss!=null?('أقصى خسارة مسموحة بحدّ الإيقاف: <b style="color:var(--red)">-$'+fmt(Math.abs(maxLoss),2)+'</b> وعندها يُوقَف النسخ تلقائياً.'):'لم تُفعّل حدّ إيقاف خسارة بعد.')+' الأرقام تقديرية ولا تضمن نتائج مستقبلية.</div>';
  box.innerHTML=html;
}

      '<td class="ltr '+(roi>=0?'up':'dn')+'">'+(roi>=0?'+':'')+fmt(roi,1)+'%</td>'+
      '<td class="ltr '+(win>=50?'up':'dn')+'">'+fmt(win,1)+'%</td>'+
      '<td class="ltr">'+fmtK(foll)+'</td>'+
      '<td class="ltr">$'+fmtK(aum)+'</td>'+
      '<td class="ltr">'+fmt(share,0)+'%</td>'+
      '<td class="ltr">'+fmt(rate,1)+' ★ ('+rev+')</td>'+
      '<td><span class="badge '+rk[1]+'">'+rk[0]+'</span></td>'+
      '<td>'+(copying?'<span class="up" style="font-size:11px">✓ تنسخه</span>':'<span class="chk" onclick="openCopy('+t.user_id+')">+</span>')+'</td>'+
    '</tr>';
  }).join('');
  var body='<div class="mdl-sub" style="margin:0 2px 6px">اختر حتى 4 متداولين لمقارنتهم جنباً إلى جنب حسب العائد، نسبة النجاح، المتابعون، الأصول المُدارة، مشاركة الأرباح والتقييم.</div>'+
    '<div style="margin:8px 0 2px">'+pick+'</div>'+
    '<div class="cmpbar">'+(chosen.length?'<button onclick="CMPPICK={};renderCmp()">مسح الاختيار</button>':'')+'<button class="primary" onclick="openCopy('+(rowsSrc[0]?rowsSrc[0].user_id:0)+')">نسخ الأفضل أداءً</button></div>'+
    '<div class="cmpwrap"><table class="cmp"><thead><tr>'+
      '<th>المتداول</th><th>عائد 30ي</th><th>نسبة النجاح</th><th>الناسخون</th><th>أصول مُدارة</th><th>مشاركة الأرباح</th><th>التقييم</th><th>المخاطر</th><th>نسخ</th>'+
    '</tr></thead><tbody>'+tr+'</tbody></table></div>';
  $('cmpBody').innerHTML=head+body;
}
function loadPerf(){
  $('perfBody').innerHTML='<div class="empty"><div class="big">⏳</div><b>جارٍ التحميل...</b></div>';
  api('/api/copy/perf').then(function(d){
    var tr=d.trader||{},a=d.agg||{},closed=d.closed||[];
    var trades=+a.trades||0,wins=+a.wins||0,losses=+a.losses||0,pnl=+a.pnl||0,avg=+a.avgRoi||0;
    var winRate=trades?(wins/trades*100):0;
    var head='<div style="display:flex;align-items:center;gap:10px;margin:2px 2px 12px"><div style="flex:1;font-size:15px;font-weight:900">الأداء والإحصائيات</div>'+
      '<button onclick="goTraders()" style="background:var(--panel2);border:1px solid var(--border);color:var(--txt);font-family:inherit;font-weight:800;font-size:12px;padding:8px 13px;border-radius:999px;cursor:pointer">→ المتداولون</button></div>';
    var stats='<div class="cbal" style="margin:0 0 12px;padding:14px">'+
      '<div class="lab">إجمالي الربح/الخسارة الموزّعة</div><div class="big" style="font-size:24px;color:'+(pnl>=0?'var(--green)':'var(--red)')+'">'+(pnl>=0?'+':'-')+'$'+fmt(Math.abs(pnl),2)+'</div>'+
      '<div class="sub"><div class="it">صفقات مغلقة<b>'+trades+'</b></div><div class="it">نسبة النجاح<b>'+fmt(winRate,1)+'%</b></div><div class="it">متوسط العائد<b>'+fmt(avg,2)+'%</b></div><div class="it">رابح/خاسر<b style="direction:ltr">'+wins+'/'+losses+'</b></div></div></div>';
    if(!closed.length){
      $('perfBody').innerHTML=head+stats+'<div class="empty"><div class="big">📊</div><b>لا صفقات مكتملة بعد</b><p>ستظهر هنا كل صفقات المتداول المغلقة مع نسبة الربح والخسارة بالتفصيل.</p></div>';
      return;
    }
    var rows=closed.map(function(c){
      var up=(+c.pnl)>=0;
      return '<div style="background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:12px 13px;margin-bottom:9px">'+
        '<div style="display:flex;align-items:center;gap:8px"><b style="flex:1;font-size:13.5px">'+esc(c.symbol)+'</b>'+
        '<span class="chip">'+(c.side==='short'?'بيع':'شراء')+'</span>'+
        '<b style="direction:ltr;font-size:14px;color:'+(+c.roi_pct>=0?'var(--green)':'var(--red)')+'">'+(+c.roi_pct>=0?'+':'')+fmt(+c.roi_pct,2)+'%</b></div>'+
        '<div class="mc-info" style="margin:9px 0 0"><div class="s"><b style="color:'+(up?'var(--green)':'var(--red)')+'">'+(up?'+':'-')+'$'+fmt(Math.abs(+c.pnl),2)+'</b><span>ربحي</span></div>'+
        '<div class="s"><b>'+(+c.followers||0)+'</b><span>ناسخ</span></div>'+
        '<div class="s"><b>'+(+c.dist>=0?'+':'-')+'$'+fmt(Math.abs(+c.dist),2)+'</b><span>موزّع للناسخين</span></div></div>'+
        '<div style="font-size:10px;color:var(--muted);margin-top:7px">'+new Date(+c.closed_at).toLocaleString('ar-EG')+'</div></div>';
    }).join('');
    $('perfBody').innerHTML=head+stats+'<div class="lbl" style="margin:4px 2px 9px">سجل الصفقات المكتملة</div>'+rows;
  }).catch(function(){$('perfBody').innerHTML='<div class="empty"><div class="big">⚠️</div><b>تعذّر التحميل</b></div>';});
}

// ================= التنبيهات =================
function checkAlerts(){
  api('/api/copy/alerts').then(function(d){
    var n=+d.unread||0;var dot=$('alertDot');if(dot)dot.style.display=n>0?'block':'none';
  }).catch(function(){});
}
function openAlerts(){
  api('/api/copy/alerts').then(function(d){
    var items=d.items||[];
    var sheet=$('mdlSheet');
    var body=items.length?items.map(function(n){
      return '<div style="background:var(--panel2);border:1px solid var(--border);border-radius:12px;padding:10px 12px;margin-bottom:8px"><b style="font-size:12.5px;display:block">'+esc(n.title)+'</b><span style="font-size:11.5px;color:var(--muted);line-height:1.6;display:block;margin-top:3px">'+esc(n.body)+'</span><div style="font-size:10px;color:var(--muted);margin-top:5px">'+new Date(+n.at).toLocaleString('ar-EG')+'</div></div>';
    }).join(''):'<div style="color:var(--muted);font-size:12px;text-align:center;padding:20px 0">لا تنبيهات نسخ بعد</div>';
    sheet.innerHTML='<div class="mdl-grip"></div><div class="mdl-h">تنبيهات النسخ</div>'+
      '<div class="mdl-sub">تُصلك هنا عند فتح/إغلاق المتداول الرئيسي لصفقة، وعند تفعيل نسخك لصفقاته.</div>'+body+
      '<button class="mdl-x" onclick="closeMdl()">إغلاق</button>';
    $('mdl').classList.add('on');
    api('/api/copy/alerts/read',{method:'POST',body:JSON.stringify({count:items.length})}).then(function(){$('alertDot').style.display='none';}).catch(function(){});
  }).catch(function(){toast('تعذّر تحميل التنبيهات');});
}

// ================= غرفة التداول المعزولة =================
var ROOMDATA={};
function openRoom(){
  api('/api/copy/room').then(function(d){
    if(!d.isTrader){toast('ستحتاج أن تصبح متداولاً رئيسياً أولاً');openApply();return;}
    ROOMDATA=d;
    var open=d.open||[],closed=d.closed||[],w=d.wallet||{};
    var openHtml=open.length?open.map(function(r){
      var up=(+r.roi_pct)>=0;
      return '<div style="background:var(--panel2);border:1px solid var(--border);border-radius:14px;padding:12px 13px;margin-bottom:9px">'+
        '<div style="display:flex;align-items:center;gap:8px"><b style="flex:1;font-size:13.5px">'+esc(r.symbol)+'</b><span class="chip">'+(r.side==='short'?'بيع':'شراء')+' ×'+(+r.leverage)+'</span>'+
        '<b style="direction:ltr;font-size:13px">'+fmt(+r.entry,4)+'</b></div>'+
        '<div class="mdl-row" style="margin-top:4px"><span>هامش</span><b>$'+fmt(+r.margin,2)+'</b></div>'+
        '<button class="mdl-go" style="margin-top:8px;padding:11px 0;font-size:13px" onclick="openCloseTrade('+r.id+')">إغلاق الصفقة وتسويتها</button></div>';
    }).join(''):'<div style="color:var(--muted);font-size:12px;text-align:center;padding:14px 0">لا صفقات مفتوحة</div>';
    var closedHtml=closed.slice(0,5).map(function(r){
      var up=(+r.pnl)>=0;
      return '<div style="display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--border);border-radius:12px;padding:9px 11px;margin-bottom:7px"><div style="flex:1;font-size:12.5px;font-weight:800">'+esc(r.symbol)+'</div><b style="direction:ltr;font-size:12.5px;color:'+(up?'var(--green)':'var(--red)')+'">'+(+r.roi_pct>=0?'+':'')+fmt(+r.roi_pct,2)+'%</b><b style="direction:ltr;font-size:12px;color:'+(up?'var(--green)':'var(--red)')+'">'+(up?'+':'-')+'$'+fmt(Math.abs(+r.pnl),2)+'</b></div>';
    }).join('');
    var sheet=$('mdlSheet');
    sheet.innerHTML='<div class="mdl-grip"></div><div class="mdl-h">غرفة التداول — متداول رئيسي</div>'+
      '<div class="mdl-sub">مساحة معزولة تماماً عن تداولك الشخصي. أي صفقة تفتحها هنا تُوزّع فوراً على كل ناسخيك مع العرض الصافي لكل واحد = هامشه × مضاعفه × نسبة الحركة.</div>'+
      '<div class="cbal" style="margin:0 0 12px;padding:13px"><div class="lab">محفظة المتداول المعزولة</div><div class="big" style="font-size:22px">'+fmt(+w.avail||0,2)+' <small>USDT</small></div>'+
        '<div class="sub"><div class="it">الناسخون<b>'+fmt(d.followers,0)+'</b></div><div class="it">أصول موزّعة<b>$'+fmtK(d.aum)+'</b></div><div class="it">مشاركة أرباح<b>'+fmt(d.profit_share,0)+'%</b></div></div></div>'+
      '<div class="lbl">فتح صفقة جديدة</div>'+
      '<div class="pickrow" id="rSymRow">'+SYMS.map(function(s,i){return '<button class="'+(i===0?'on':'')+'" onclick="rSym(this)">'+s.replace('USDT','')+'</button>';}).join('')+'</div>'+
      '<div class="seg" style="margin-top:9px"><button class="on" id="rLong" onclick="rSide(\'long\')">شراء / لونج</button><button id="rShort" onclick="rSide(\'short\')">بيع / شورت</button></div>'+
      '<div class="rows2" style="margin-top:9px"><div class="mdl-amt"><input id="rMargin" type="text" inputmode="decimal" placeholder="هامش USDT"></div><div class="mdl-amt"><input id="rLev" type="text" inputmode="decimal" placeholder="رافعة ×" value="1"></div></div>'+
      '<button class="mdl-go" onclick="roomOpen()">فتح الصفقة وتوزيعها على الناسخين</button>'+
      '<div class="lbl" style="margin-top:16px">صفقات مفتوحة</div>'+openHtml+
      (closed.length?('<div class="lbl" style="margin-top:12px">آخر الصفقات المغلقة</div>'+closedHtml):'')+
      '<button class="mdl-x" onclick="closeMdl()">إغلاق</button>';
    $('mdl').classList.add('on');
  }).catch(function(){toast('تعذّر فتح الغرفة');});
}
var RSYM='BTCUSDT',RSIDE='long';
function rSym(el){document.querySelectorAll('#rSymRow button').forEach(function(b){b.classList.remove('on');});el.classList.add('on');RSYM=el.textContent+'USDT';}
function rSide(s){RSIDE=s;$('rLong').classList.toggle('on',s==='long');$('rShort').classList.toggle('on',s==='short');}
function roomOpen(){
  var m=parseFloat(($('rMargin')||{}).value)||0,lev=parseFloat(($('rLev')||{}).value)||1;
  if(m<=0){toast('أدخل الهامش');return;}
  api('/api/copy/room/open',{method:'POST',body:JSON.stringify({symbol:RSYM,side:RSIDE,margin:m,leverage:lev})}).then(function(d){
    toast('✓ فُتحت الصفقة ووُزّعت على '+ (ROOMDATA.followers||0) +' ناسخ');openRoom();checkAlerts();
  }).catch(function(err){toast(err==='not_a_trader'?'أنت لست متداولاً رئيسياً':'تعذّر فتح الصفقة');});
}
function openCloseTrade(id){
  var sheet=$('mdlSheet');
  sheet.innerHTML='<div class="mdl-grip"></div><div class="mdl-h">إغلاق الصفقة</div>'+
    '<div class="mdl-sub">أدخل نسبة الربح أو الخسارة المحققة على حركة السعر (مثال: 4.5 للربح، -2.5 للخسارة). سيُوزّع الناتج فوراً على كل ناسخيك.</div>'+
    '<div class="mdl-amt"><input id="crRoi" type="text" inputmode="decimal" placeholder="% حركة السعر"><span class="cur">%</span></div>'+
    '<button class="mdl-go" onclick="roomClose('+id+')">تأكيد الإغلاق والتسوية</button>'+
    '<button class="mdl-x" onclick="openRoom()">رجوع</button>';
  $('mdl').classList.add('on');
}
function roomClose(id){
  var roi=parseFloat(($('crRoi')||{}).value);
  if(isNaN(roi)){toast('أدخل النسبة');return;}
  api('/api/copy/room/close',{method:'POST',body:JSON.stringify({room_id:id,roi_pct:roi})}).then(function(d){
    toast('✓ أُغلقت الصفقة — وزّعت '+(d.distributed||0)+' نسخة');openRoom();refreshWallet();checkAlerts();
  }).catch(function(){toast('تعذّر الإغلاق');});
}

function openLearn(){
  var sheet=$('mdlSheet');
  sheet.innerHTML='<div class="mdl-grip"></div><div class="mdl-h">الدروس التعليمية</div>'+
    '<div class="note"><b>١) كيف يعمل نسخ التداول؟</b><br>تختار متداولاً وتحدد مبلغاً، ثم تُنسخ صفقاته الجديدة على رصيدك بنسبة مبلغك.</div>'+
    '<div class="note"><b>٢) متى يتغير رصيدي؟</b><br>فقط عند إغلاق صفقات المتداول الرئيسي (تسوية) — لا يوجد ربح تلقائي أو عشوائي.</div>'+
    '<div class="note"><b>٣) محفظة النسخ</b><br>محفظة منفصلة عن محفظتك الفورية. حوّل إليها رصيداً قبل بدء النسخ أو التقديم كمتداول رئيسي.</div>'+
    '<div class="note"><b>٤) نسبة مشاركة الأرباح</b><br>المتداول الرئيسي يحدد النسبة (0-50%) التي يحصل عليها من أرباحك المحققة.</div>'+
    '<button class="mdl-x" onclick="closeMdl()">إغلاق</button>';
  $('mdl').classList.add('on');
}
function closeMdl(){$('mdl').classList.remove('on');CUR=null;}

window.setMarket=setMarket;window.setFilter=setFilter;window.toggleFav=toggleFav;window.goMine=goMine;window.goTraders=goTraders;
window.openCopy=openCopy;window.cMode=cMode;window.cSet=cSet;window.cMult=cMult;window.cCalc=cCalc;window.cSym=cSym;window.cAdv=cAdv;window.cFlag=cFlag;window.cSlip=cSlip;window.cToggleAgree=cToggleAgree;window.doCopy=doCopy;window.stopCopy=stopCopy;
window.openTransfer=openTransfer;window.xDir=xDir;window.xSet=xSet;window.doTransfer=doTransfer;
window.openApply=openApply;window.aKind=aKind;window.aPub=aPub;window.aAgree=aAgree;window.doApply=doApply;
window.openLearn=openLearn;window.openTradePanel=openTradePanel;window.tSym=tSym;window.tSide=tSide;window.tradeSubmit=tradeSubmit;window.settleTrade=settleTrade;window.closeMdl=closeMdl;
window.goPerf=goPerf;window.openAlerts=openAlerts;window.openRoom=openRoom;window.rSym=rSym;window.rSide=rSide;window.roomOpen=roomOpen;window.openCloseTrade=openCloseTrade;window.roomClose=roomClose;
window.openCompare=openCompare;window.toggleCmp=toggleCmp;window.renderCmp=renderCmp;

$('mdl').addEventListener('click',function(e){if(e.target===$('mdl'))closeMdl();});
loadTraders().then(function(){
  if(IS_TRADER){var sr=$('svcRoom');if(sr)sr.style.display='block';}
  return refreshWallet();
}).then(function(){checkAlerts();});
setInterval(function(){if(MINEVIEW)refreshWallet();checkAlerts();},15000);
</script>
</script>
